name: Apply portal patch
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[portal-multi-patch]"* ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          start=s.index('function render(cs){'); end=s.index('function prepareCanvas', start)
          new=r'''function render(cs){const root=$('#campaigns');root.innerHTML='';if(!cs.length){root.innerHTML='<div class="glass"><h3>No open price-change list</h3><p class="muted">Nothing has been assigned to your driver account yet.</p></div>';return}for(const c of cs){const card=document.createElement('section');card.className='glass';card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><div class="muted small">Server date/time is recorded automatically on save.</div><div class="customers"></div>';for(const a of c.assignments||[]){const v=editingVisitId?(c.visits||[]).find(x=>String(x.id)===String(editingVisitId)&&String(x.assignment_id)===String(a.id)):null;renderCustomer(card.querySelector('.customers'),c,a,v)}root.appendChild(card)}}
function renderCustomer(host,c,a,v=null){const w=document.createElement('div');w.className='customer';w.dataset.assignmentId=a.id;if(v){w.dataset.visitId=v.id||'';w.dataset.attachment=v.attachment_path||'';w.dataset.signature=v.signature_path||''}const areas=(c.areas||[]).filter(x=>x.active!==false);const selected=v?.location||'';const opts=areas.map(x=>'<option value="'+esc(x.area_name)+'"'+(String(x.area_name)===String(selected)?' selected':'')+'>'+esc(x.area_name)+'</option>').join('');w.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">Price change visit</div><h3 style="margin:4px 0">'+esc(v?.customer_name||'New submission')+'</h3><span class="small">Complete the visit details below.</span></div></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacy / Customer name *</label><input class="customer-name" value="'+esc(v?.customer_name||'')+'" placeholder="Enter pharmacy name"></div><div class="field"><label>Area *</label><select class="location"><option value="">Select area</option>'+opts+'</select></div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="tel" type="tel" inputmode="numeric" pattern="[0-9]*" value="'+esc(v?.telephone||'')+'" placeholder="Numbers only"></div></div><div class="items"></div><div class="evidence" style="margin-top:14px"><div class="field"><label>Pharmacist name *</label><input class="pharm" value="'+esc(v?.pharmacist_name||'')+'" placeholder="Required"></div><div class="field"><label>Pharmacy / place photo *</label><input class="photo" type="file" accept="image/*"><div class="saved-photo-slot"></div></div></div><div class="no-stock" style="margin-top:12px"><label><input class="nostock" type="checkbox" '+(v?.status==='NO_STOCK'?'checked':'')+'> No Stock — nothing repriced</label></div><div style="margin-top:12px"><label>Signature / Stamp <span class="muted">optional</span></label><button class="btn signature-open" type="button" style="margin-top:7px;width:100%">✍️ Click to sign</button><div class="saved-signature-slot"></div></div><div class="field" style="margin-top:12px"><label>Notes <span class="muted">optional</span></label><textarea class="notes" rows="2">'+esc(v?.notes||'')+'</textarea></div><div class="row" style="margin-top:14px"><button class="btn primary save" type="button">Save / Submit visit</button><button class="btn danger del '+(v?'':'hide')+'" type="button">Delete my submission</button><span class="msg small"></span></div>';const assigned=new Set((c.assignment_items||[]).filter(x=>String(x.assignment_id)===String(a.id)).map(x=>String(x.item_id)));for(const i of c.items||[]){if(!assigned.has(String(i.id)))continue;const old=(v?.price_change_visit_items||[]).find(x=>x.item_id===i.id),r=document.createElement('div');r.className='item';r.innerHTML='<div><strong>'+esc(i.line_no)+'. '+esc(i.item_description)+'</strong><div class="muted small">New Price: '+esc(i.new_public_price??i.new_pharmacy_price??'—')+'</div></div><div><div class="qty-label">Quantity</div><input class="qty" data-item="'+i.id+'" type="number" min="0" step="1" value="'+(old?.quantity??'')+'"></div>';w.querySelector('.items').appendChild(r)}const tel=w.querySelector('.tel');tel.addEventListener('input',()=>{tel.value=tel.value.replace(/[^0-9]/g,'')});if(v?.attachment_path){const b=w.querySelector('.saved-photo-slot');b.innerHTML='<div class="saved-evidence">✓ Existing pharmacy photo saved <button type="button" class="btn view-photo">Open photo</button></div>';b.querySelector('.view-photo').onclick=async()=>{try{const u=await signEvidenceForDriver(v.attachment_path);if(u)window.open(u,'_blank','noopener,noreferrer')}catch(e){setmsg(w.querySelector('.msg'),e.message)}}}if(v?.signature_path){const b=w.querySelector('.saved-signature-slot');b.innerHTML='<div class="saved-evidence">✓ Existing signature saved <button type="button" class="btn view-signature">Open signature</button></div>';b.querySelector('.view-signature').onclick=async()=>{try{const u=await signEvidenceForDriver(v.signature_path);if(u)window.open(u,'_blank','noopener,noreferrer')}catch(e){setmsg(w.querySelector('.msg'),e.message)}}}w.querySelector('.signature-open').onclick=()=>openSignature(w);w.querySelector('.save').onclick=()=>saveVisit(c,a,w);w.querySelector('.del').onclick=async()=>{if(!w.dataset.visitId||!confirm('Delete your submission?'))return;try{await api('/rest/v1/rpc/dispatchops_driver_delete_visit',{p_token:token,p_visit_id:w.dataset.visitId});toast('Submission deleted');editingVisitId=null;await load()}catch(e){setmsg(w.querySelector('.msg'),e.message)}};host.appendChild(w)}
'''
          s=s[:start]+new+s[end:]
          s=s.replace('<button id="mine" class="btn menuitem">✓ My submitted visits</button>','').replace("$('#mine').onclick=buildList;","")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'Metromite'
          git config user.email 'khaledehab3@gmail.com'
          git add index.html
          git commit -m 'Fix multiple visits and numeric mobile fields [portal-multi-patch]' || exit 0
          git rm .github/workflows/apply-portal-patch.yml .github/workflows/patch-multiple-visits.yml .github/portal-patch-trigger-2.txt .github/portal-patch-trigger-3.txt 2>/dev/null || true
          git commit -m 'Remove temporary portal patch workflows [portal-multi-patch]' || true
          git push