name: Extract save function
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    if: github.event.head_commit.message != 'Extract save function'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          for name in ['async function saveVisit','function buildList']:
              i=s.find(name)
              out.append(f'=== {name} ===\n')
              out.append(s[i:i+7000] if i>=0 else 'NOT FOUND')
              out.append('\n\n')
          Path('_debug-save.txt').write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _debug-save.txt
          git commit -m 'Extract save function'
          git push
