name: Apply portal fixes
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only requested UI behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ("const name=w.querySelector('.customer-name').value.trim(),loc=w.querySelector('.location').value.trim(),ph=w.querySelector('.pharm').value.trim(),ns=w.querySelector('.nostock').checked;",
             "const name=w.querySelector('.customer-name').value.trim(),locEl=w.querySelector('.location'),loc=String(locEl?.selectedOptions?.[0]?.value||locEl?.value||w.dataset.location||'').trim(),ph=w.querySelector('.pharm').value.trim(),ns=w.querySelector('.nostock').checked;"),
            ("const tel=w.querySelector('.tel');tel.addEventListener('input',()=>{tel.value=tel.value.replace(/[^0-9]/g,'')});",
             "const locEl=w.querySelector('.location');locEl.addEventListener('change',()=>{w.dataset.location=String(locEl.selectedOptions?.[0]?.value||locEl.value||'').trim()});w.dataset.location=String(locEl.selectedOptions?.[0]?.value||locEl.value||'').trim();const tel=w.querySelector('.tel');tel.addEventListener('input',()=>{tel.value=tel.value.replace(/[^0-9]/g,'')});"),
            ('<div class="items"></div>', '<div class="items"><div class="small muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.9px;margin-bottom:2px">Items</div></div>'),
            ('<div class="small muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">Item</div><strong>'+esc(i.line_no)+'. '+esc(i.item_description)+'</strong>', '<div class="small muted" style="font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px">'+esc(i.line_no)+'</div><strong>'+esc(i.item_description)+'</strong>'),
            ("toast('Visit saved successfully');await load()", "toast('Visit saved successfully');editingVisitId=null;await load();requestAnimationFrame(()=>document.querySelector('.customer')?.scrollIntoView({behavior:'smooth',block:'center'}))")
          ]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Expected source pattern not found; no changes applied: '+old[:100])
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-portal-fixes.yml
          git add index.html
          git commit -m 'Fix area save, item labels, and edited visit reset'
          git push
