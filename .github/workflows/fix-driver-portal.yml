name: Fix driver portal
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[portal-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const v=(c.visits||[]).find(x=>x.assignment_id===a.id);"
          new="const v=(c.visits||[]).find(x=>String(x.assignment_id)===String(a.id));"
          if old in s:
              s=s.replace(old,new,1)
          old="const assigned=new Set((c.assignment_items||[]).filter(x=>x.assignment_id===a.id).map(x=>x.item_id));"
          new="const assigned=new Set((c.assignment_items||[]).filter(x=>String(x.assignment_id)===String(a.id)).map(x=>String(x.item_id)));"
          if old in s:
              s=s.replace(old,new,1)
          old="if(!assigned.has(i.id))continue;"
          new="if(!assigned.has(String(i.id)))continue;"
          if old in s:
              s=s.replace(old,new,1)
          old="return x.path}"
          new="if(!x.path)throw Error('Photo upload did not return a file path');return x.path}"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-driver-portal.yml
          git add index.html .github/workflows/fix-driver-portal.yml
          git commit -m 'Fix driver edit and photo save [portal-patch]'
          git push