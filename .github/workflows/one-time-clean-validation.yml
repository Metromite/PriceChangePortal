name: One-time validation cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor == 'Metromite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate validation controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\n/\* Price Portal validation retry controller \*/\n\(function\(\)\{.*?\n\}\)\(\);\n\n</script>'
          cleaned, n = re.subn(pattern, '\n</script>', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected exactly one validation controller, found {n}')
          if 'Price Portal validation retry controller' in cleaned:
              raise SystemExit('Validation controller still present after cleanup')
          p.write_text(cleaned, encoding='utf-8')
          PY
          rm -f .github/workflows/one-time-clean-validation.yml
      - name: Commit clean portal
        run: |
          git config user.name 'Metromite'
          git config user.email 'khaledehab3@gmail.com'
          git add index.html .github/workflows/one-time-clean-validation.yml
          git commit -m 'Clean validation controller and restore stable portal path'
          git push
