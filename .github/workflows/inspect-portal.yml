name: Inspect portal save logic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          for key in ['const upload','function upload','Photo upload','\.photo','nostock','\.save','addEventListener(\'click\'']:
            print('\n===',key,'===')
            p=0
            while True:
              p=s.find(key,p)
              if p<0: break
              print(s[max(0,p-700):p+1800])
              p+=len(key)
          PY
