name: Inspect save logic
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message != 'Inspect save logic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function renderCustomer','async function saveVisit','function buildList','clearValidation','locEl']:
              i=s.find(needle)
              print('\n===',needle,'at',i,'===')
              print(s[max(0,i-800):i+5000])
          PY
