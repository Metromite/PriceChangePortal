name: Final portal patch
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[portal-multi-patch]"* ]]; then exit 0; fi
          python3 scripts/patch_portal.py
      - name: Commit and cleanup
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[portal-multi-patch]"* ]]; then exit 0; fi
          git config user.name 'Metromite'
          git config user.email 'khaledehab3@gmail.com'
          git add index.html
          git commit -m 'Fix multiple visits and numeric mobile fields [portal-multi-patch]'
          git rm .github/workflows/final-portal-patch.yml .github/workflows/apply-portal-patch.yml .github/workflows/patch-multiple-visits.yml .github/portal-patch-trigger-2.txt .github/portal-patch-trigger-3.txt .github/portal-patch-trigger-4.txt 2>/dev/null || true
          git commit -m 'Remove temporary portal patch workflows [portal-multi-patch]' || true
          git push