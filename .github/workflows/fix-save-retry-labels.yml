name: Fix save retry and field labels
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix save retry and required optional labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          patch=r'''<style>
          .field label .req-note,.field label .opt-note,.evidence label .req-note,.evidence label .opt-note{font-size:10px;font-weight:700;letter-spacing:.2px;color:#64748b;margin-left:6px;text-transform:uppercase}
          </style>
          <script>
          (()=>{
            const isEditable=e=>e && e.matches('input,select,textarea') && !e.disabled;
            const rearm=el=>{
              const w=el?.closest?.('.customer'); if(!w)return;
              const b=w.querySelector('.save');
              if(b){ b.disabled=false; b.removeAttribute('disabled'); }
              const m=w.querySelector('.msg');
              if(m && m.classList.contains('err')){m.textContent='';m.className='small';}
            };
            document.addEventListener('input',e=>{if(isEditable(e.target)) rearm(e.target)},true);
            document.addEventListener('change',e=>{if(isEditable(e.target)) rearm(e.target)},true);
            document.addEventListener('click',e=>{
              const b=e.target.closest?.('.save');
              if(b && b.disabled){ b.disabled=false; b.removeAttribute('disabled'); }
            },true);
            new MutationObserver(muts=>{
              for(const m of muts){
                if(m.type==='attributes' && m.attributeName==='disabled'){
                  const b=m.target;
                  if(b.matches?.('.save')){
                    const w=b.closest('.customer');
                    if(w && w.querySelector('input:not([type=file]),select,textarea')){
                      // Keep Save available after validation; the save handler itself remains authoritative.
                      b.disabled=false; b.removeAttribute('disabled');
                    }
                  }
                }
              }
            }).observe(document.body,{subtree:true,attributes:true,attributeFilter:['disabled']});
            const labelFields=()=>document.querySelectorAll('.customer .field label,.customer .evidence label').forEach(l=>{
              if(l.querySelector('.req-note,.opt-note'))return;
              const text=l.textContent.trim();
              const note=document.createElement('span');
              const required=/\*/.test(text);
              note.className=required?'req-note':'opt-note';
              note.textContent=required?'Required':'Optional';
              l.appendChild(note);
            });
            labelFields();
            new MutationObserver(labelFields).observe(document.body,{subtree:true,childList:true});
          })();
          </script>
          '''
          if 'Keep Save available after validation' not in s:
              s=s.replace(marker,patch+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix save retry and required optional labels'
          git push
          git rm .github/workflows/fix-save-retry-labels.yml
          git commit -m 'Remove temporary save fix workflow'
          git push
