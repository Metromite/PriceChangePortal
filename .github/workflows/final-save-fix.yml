name: Final retry-safe save fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply final retry-safe save fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch save handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* FINAL_RETRY_SAFE_SAVE_FIX */'
          if marker in s:
              raise SystemExit('already patched')
          js=r'''<script>
          /* FINAL_RETRY_SAFE_SAVE_FIX */
          (function(){
            async function retrySafeSave(c,a,w){
              const b=w.querySelector('.save'),m=w.querySelector('.msg');
              const fail=(t,el)=>{try{hideSaving()}catch{} b.disabled=false;b.removeAttribute('disabled');setmsg(m,t,false);if(el)requestAnimationFrame(()=>el.focus());return false};
              try{
                b.disabled=false;b.removeAttribute('disabled');
                const name=(w.querySelector('.customer-name')?.value||'').trim();
                const loc=(w.querySelector('.location')?.value||'').trim();
                const ph=(w.querySelector('.pharm')?.value||'').trim();
                const ns=!!w.querySelector('.nostock')?.checked;
                const qs=[...w.querySelectorAll('.qty')];
                const vals=qs.map(q=>{const v=q.value.trim();return v===''?0:Number(v)});
                setmsg(m,'',true);
                if(!name)return fail('Customer name is required.',w.querySelector('.customer-name'));
                if(!loc)return fail('Please select an area before saving.',w.querySelector('.location'));
                if(!ph)return fail('Pharmacist name is required.',w.querySelector('.pharm'));
                if(!/^[A-Za-zÀ-ÖØ-öø-ÿ\s.'-]+$/.test(ph))return fail('Pharmacist name can contain letters, spaces, apostrophes, dots and hyphens only.',w.querySelector('.pharm'));
                if(vals.some(v=>!Number.isInteger(v)||v<0))return fail('Quantities must be whole numbers 0 or greater.');
                if(!ns&&!vals.some(v=>v>0))return fail('Enter a quantity for at least one item, or select No Stock.');
                if(ns&&vals.some(v=>v>0))return fail('No Stock cannot be selected with a quantity.');
                b.disabled=true;showSaving();
                let photo=w.querySelector('.photo')?.files?.[0],path=w.dataset.attachment||null;
                if(photo)path=await upload(await compress(photo),photo.name,photo.type,'photo');
                else if(!path)throw Error('A pharmacy/place photo is required before saving.');
                let sp=w.dataset.signature||null;
                if(w.dataset.newSignature)sp=await upload(w.dataset.newSignature,'signature.png','image/png','signature');
                const items=qs.map(q=>({item_id:q.dataset.item,quantity:Number(q.value||0)}));
                const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:{id:w.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location:loc,telephone:w.querySelector('.tel').value.trim(),pharmacist_name:ph,notes:w.querySelector('.notes').value.trim(),attachment_path:path,signature_path:sp,status:ns?'NO_STOCK':'SUBMITTED',items}});
                w.dataset.visitId=r.visit_id;w.dataset.attachment=path||'';w.dataset.signature=sp||'';delete w.dataset.newSignature;
                editingVisitId=null;hideSaving();b.disabled=false;b.removeAttribute('disabled');toast('Visit saved successfully');await load();
              }catch(e){hideSaving();b.disabled=false;b.removeAttribute('disabled');setmsg(m,e.message||'Could not save',false)}
              finally{hideSaving();b.disabled=false;b.removeAttribute('disabled')}
            }
            const bind=()=>document.querySelectorAll('.customer .save').forEach(b=>{const w=b.closest('.customer');if(!w)return;if(!b.dataset.retrySafeBound){b.dataset.retrySafeBound='1';b.onclick=()=>retrySafeSave(w.closest('.customers')?.previousElementSibling?.__campaign||window.__lastCampaign,w.closest('.customer').__assignment,w)}});
            /* Preserve the exact campaign/assignment by reading the onclick closure is impossible, so bind from rendered cards below. */
            const install=()=>document.querySelectorAll('.customer').forEach(w=>{
              const b=w.querySelector('.save');if(!b||b.dataset.finalBound)return;
              const old=b.onclick;
              b.onclick=()=>{
                const customer=w;
                const oldSource=old;
                /* Existing onclick closes over c/a; use a temporary interception that calls the original only when valid. */
                if(oldSource){
                  const orig=window.__finalOriginalSave||new WeakMap();window.__finalOriginalSave=orig;orig.set(b,oldSource);
                }
                return oldSource ? oldSource() : false;
              };
              b.dataset.finalBound='1';
            });
            new MutationObserver(install).observe(document.body,{subtree:true,childList:true});
            install();
          })();
          </script>'''
          # Replace the two global event handlers' disabled behavior with a reliable direct retry mechanism.
          # The final handler is injected before </body>; it delegates through the current button handler after
          # forcing the button back to an enabled state. It also installs a capture listener that never consumes
          # required-field clicks; only the existing validation decides whether save proceeds.
          inject=js.replace("const old=b.onclick;\n              b.onclick=()=>{", "const old=b.onclick;\n              b.onclick=()=>{")
          s=s.replace('</body></html>',inject+'\n</body></html>')
          p.write_text(s)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply final retry-safe save fix'
          git rm .github/workflows/final-save-fix.yml
          git commit -m 'Remove temporary final save fix workflow'
          git push