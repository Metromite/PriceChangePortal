name: Definitive Price Portal validation fix
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch validation logic directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove the legacy document-level handlers that erase the validation message.
          s=re.sub(r"document\\.addEventListener\\('input',e=>\\{const w=e\\.target\\.closest\\('\\.customer'\\);.*?\\}\\);document\\.addEventListener\\('change',e=>\\{const w=e\\.target\\.closest\\('\\.customer'\\);.*?\\}\\);", '', s, count=1, flags=re.S)

          patch = r'''\n/* Definitive validation retry controller */
(function(){
  function errorsFor(w){
    const errors=[];
    const name=w.querySelector('.customer-name');
    const loc=w.querySelector('.location');
    const pharm=w.querySelector('.pharm');
    const qtys=[...w.querySelectorAll('.qty')];
    const ns=w.querySelector('.nostock');
    const photo=w.querySelector('.photo');
    const nameVal=(name?.value||'').trim();
    const areaVal=(loc?.value||'').trim();
    const pharmVal=(pharm?.value||'').trim();
    if(!nameVal) errors.push('Pharmacy / Customer name is required');
    if(!areaVal) errors.push('Area is required');
    if(!pharmVal) errors.push('Pharmacist is required');
    else if(!/^[A-Za-z][A-Za-z .\'-]{1,99}$/.test(pharmVal)) errors.push('Pharmacist name is invalid');
    let positive=0,badQty=false;
    qtys.forEach(q=>{const raw=(q.value||'').trim();if(raw!==''&&!/^\\d+$/.test(raw))badQty=true;const n=raw===''?0:Number(raw);if(Number.isFinite(n)&&n>0)positive+=n;});
    if(badQty) errors.push('Quantity must be a whole number of 0 or more');
    const noStock=!!ns?.checked;
    if(positive<=0&&!noStock) errors.push('Enter at least one positive quantity or select No Stock');
    if(noStock&&positive>0) errors.push('No Stock cannot be selected when a positive quantity is entered');
    if(!(w.dataset.attachment) && !(photo?.files?.length)) errors.push('Photo is required');
    return errors;
  }
  function refresh(w){
    if(!w||w.dataset.validationAttempted!=='1'||w.dataset.saving==='1')return;
    const m=w.querySelector('.msg');
    if(!m)return;
    const errors=errorsFor(w);
    m.textContent=errors.length?'Please complete the following before saving:\n'+errors.map(x=>'• '+x).join('\n'):'';
    m.className=errors.length?'small err':'small';
    const b=w.querySelector('.save');
    if(b){b.disabled=false;b.removeAttribute('disabled');b.removeAttribute('aria-busy');}
  }
  document.addEventListener('click',function(e){
    const b=e.target.closest('.customer .save');
    if(b){const w=b.closest('.customer');if(w)w.dataset.validationAttempted='1';}
  },true);
  document.addEventListener('input',function(e){const w=e.target.closest('.customer');if(w&&w.dataset.validationAttempted==='1')refresh(w);},true);
  document.addEventListener('change',function(e){const w=e.target.closest('.customer');if(w&&w.dataset.validationAttempted==='1')refresh(w);},true);
  document.addEventListener('click',function(e){const w=e.target.closest('.customer');if(w&&e.target.closest('.save'))setTimeout(()=>refresh(w),0);});
})();
'''
          # Remove a previous copy if present, then insert before the first closing script tag.
          s=re.sub(r"\\n/\\* Definitive validation retry controller \\*/.*?\\n\\(function\\(\\)\\{.*?\\n\\}\\)\\(\\);\\n", '', s, count=1, flags=re.S)
          if '</script>' not in s:
              raise SystemExit('No closing script tag found')
          s=s.replace('</script>', patch+'\n</script>', 1)
          p.write_text(s,encoding='utf-8')
          print('patched index.html')
          PY
      - name: Commit patched portal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No changes required'; exit 0; fi
          git commit -m 'Apply definitive live validation retry fix'
          git push
