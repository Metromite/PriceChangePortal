name: One-time UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quantity label spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.qty-label{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.9px;text-align:center;margin-bottom:-7px}'
          new = '.qty-label{font-size:11px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.9px;text-align:center;margin-bottom:6px;line-height:1.2}'
          if old not in s:
              raise SystemExit('Expected quantity label CSS was not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-ui.yml
          git add index.html .github/workflows/patch-ui.yml
          git commit -m 'Fix quantity label spacing [ui-patch]'
          git push