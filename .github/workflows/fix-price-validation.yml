name: Fix Price Portal validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch validation retry behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const clearValidation=()=>{const m=w.querySelector('.msg');if(m.classList.contains('err')){m.textContent='';m.className='msg small'}};w.querySelectorAll('.customer-name,.location,.pharm,.photo,.tel,.notes,.qty,.nostock').forEach(el=>{el.addEventListener('input',()=>{clearValidation();w.querySelector('.save').disabled=false;hideSaving()});el.addEventListener('change',()=>{clearValidation();w.querySelector('.save').disabled=false;hideSaving()})});"
          new = r'''const clearValidation=()=>{const m=w.querySelector('.msg');if(m.classList.contains('err')){m.textContent='';m.className='msg small'}};
          const refreshValidation=()=>{
            if(w.dataset.validationAttempted!=='1') return;
            const name=String(w.querySelector('.customer-name')?.value||'').trim();
            const loc=String(w.querySelector('.location')?.value||'').trim();
            const ph=String(w.querySelector('.pharm')?.value||'').trim();
            const ns=!!w.querySelector('.nostock')?.checked;
            const qs=[...w.querySelectorAll('.qty')];
            const vals=qs.map(q=>{const raw=String(q.value||'').trim();return raw===''?0:Number(raw)});
            const errors=[];
            if(!name) errors.push('Pharmacy / Customer name is required.');
            if(!loc) errors.push('Area is required. Please select an area.');
            if(!ph) errors.push('Pharmacist name is required.');
            else if(!/^[A-Za-zÀ-ÖØ-öø-ÿ\s.'-]+$/.test(ph)) errors.push('Pharmacist name can contain letters, spaces, apostrophes, periods, and hyphens only.');
            if(vals.some(v=>!Number.isFinite(v)||v<0||!Number.isInteger(v))) errors.push('Quantity must be a non-negative whole number.');
            const positive=vals.some(v=>Number.isFinite(v)&&v>0);
            if(!positive&&!ns) errors.push('Enter at least one positive quantity, or select No Stock.');
            if(ns&&positive) errors.push('No Stock cannot be used together with a quantity.');
            const hasExistingPhoto=!!w.dataset.attachment;
            const hasNewPhoto=!!w.querySelector('.photo')?.files?.length;
            if(!hasExistingPhoto&&!hasNewPhoto) errors.push('Pharmacy / place photo is required.');
            const m=w.querySelector('.msg');
            if(errors.length){
              setmsg(m,'Please complete the following before saving:\n'+errors.map(x=>'• '+x).join('\n'),false);
              w.querySelector('.save').disabled=false;
            }else{
              m.textContent='';m.className='msg small';w.querySelector('.save').disabled=false;
            }
          };
          w.querySelectorAll('.customer-name,.location,.pharm,.photo,.tel,.notes,.qty,.nostock').forEach(el=>{el.addEventListener('input',()=>{w.querySelector('.save').disabled=false;hideSaving();refreshValidation()});el.addEventListener('change',()=>{w.querySelector('.save').disabled=false;hideSaving();refreshValidation()})});'''
          if old in s:
              s = s.replace(old, new, 1)
          marker = "if(w.dataset.saving==='1')return;"
          replacement = "if(w.dataset.saving==='1')return;\n  w.dataset.validationAttempted='1';"
          if replacement not in s and marker in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix validation retry to show only remaining missing fields'
          git push
