name: Final UI and save fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-ui-save-fix.yml'

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch portal
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Header controls: put Menu + Sign out on the left.
          s = s.replace('.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}', '.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.top-actions{order:-1;align-items:center}')
          s = s.replace('.items{margin-top:12px}.items{margin-top:12px}', '.items{margin-top:24px}')
          s = s.replace('.items{margin-top:12px}', '.items{margin-top:24px}')
          s = s.replace('.drawer.open{transform:translateX(0)}', '.drawer.open{transform:translateX(0);touch-action:auto}.drawer{touch-action:auto;-webkit-overflow-scrolling:touch}')
          s = s.replace('.backdrop{position:fixed;', 'html.menu-open,body.menu-open{overflow:hidden;overscroll-behavior:none}body.menu-open{touch-action:none}.backdrop{position:fixed;')
          s = s.replace('<div class="row"><button id="menuBtn"', '<div class="row top-actions"><button id="menuBtn"')

          # Make every field change immediately re-arm Save, even after a failed validation/save attempt.
          old = "el.addEventListener('input',clearValidation);el.addEventListener('change',clearValidation)"
          new = "el.addEventListener('input',()=>{clearValidation();w.querySelector('.save').disabled=false;hideSaving()});el.addEventListener('change',()=>{clearValidation();w.querySelector('.save').disabled=false;hideSaving()})"
          s = s.replace(old, new)

          # Replace save flow with a retry-safe implementation. It always reads the current DOM values,
          # resets the button after validation errors, and cannot leave the saving overlay/button locked.
          start = s.index('async function saveVisit(c,a,w){')
          end = s.index('function buildList(){', start)
          fn = r'''async function saveVisit(c,a,w){
const m=w.querySelector('.msg'),saveBtn=w.querySelector('.save');
// Always re-arm the button when Save is clicked again after an error.
saveBtn.disabled=false;hideSaving();
const name=String(w.querySelector('.customer-name')?.value||'').trim();
const locEl=w.querySelector('.location');
const loc=String(locEl?.value||'').trim();
const ph=String(w.querySelector('.pharm')?.value||'').trim();
const ns=!!w.querySelector('.nostock')?.checked;
const qs=[...w.querySelectorAll('.qty')];
const vals=qs.map(x=>x.value.trim()===''?0:Number(x.value));
const fail=(text,focusEl)=>{hideSaving();saveBtn.disabled=false;setmsg(m,text,false);if(focusEl){requestAnimationFrame(()=>focusEl.focus())}return false};
setmsg(m,'',true);
if(!name)return fail('Customer name is required.',w.querySelector('.customer-name'));
if(!loc)return fail('Please select an area before saving.',locEl);
if(!ph)return fail('Pharmacist name is required.',w.querySelector('.pharm'));
if(!/^[A-Za-zÀ-ÖØ-öø-ÿ\s.'-]+$/.test(ph))return fail('Pharmacist name can contain letters, spaces, apostrophes, dots and hyphens only.',w.querySelector('.pharm'));
if(vals.some(x=>!Number.isInteger(x)||x<0))return fail('Quantities must be whole numbers 0 or greater.',qs.find(x=>!Number.isInteger(Number(x.value))||Number(x.value)<0));
if(!ns&&!vals.some(x=>x>0))return fail('Enter a quantity or select No Stock.');
if(ns&&vals.some(x=>x>0))return fail('No Stock cannot be selected with a quantity.');
try{
 saveBtn.disabled=true;showSaving();
 let photo=w.querySelector('.photo').files[0],path=w.dataset.attachment||null;
 if(photo)path=await upload(await compress(photo),photo.name,photo.type,'photo');
 else if(!path)throw Error('A pharmacy/place photo is required before saving.');
 let sp=w.dataset.signature||null;
 if(w.dataset.newSignature)sp=await upload(w.dataset.newSignature,'signature.png','image/png','signature');
 const items=qs.map(x=>({item_id:x.dataset.item,quantity:Number(x.value||0)}));
 const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:{id:w.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location:loc,telephone:w.querySelector('.tel').value.trim(),pharmacist_name:ph,notes:w.querySelector('.notes').value.trim(),attachment_path:path,signature_path:sp,status:ns?'NO_STOCK':'SUBMITTED',items}});
 w.dataset.visitId=r.visit_id;w.dataset.attachment=path||'';w.dataset.signature=sp||'';delete w.dataset.newSignature;
 hideSaving();toast('Visit saved successfully');editingVisitId=null;
 // Successful Edit -> Save returns to a fresh New Submission view.
 await load();
 requestAnimationFrame(()=>document.querySelector('.customer')?.scrollIntoView({behavior:'smooth',block:'center'}));
}catch(e){hideSaving();saveBtn.disabled=false;setmsg(m,e.message||'Could not save',false)}finally{saveBtn.disabled=false;hideSaving()}}
'''
          s = s[:start] + fn + s[end:]

          # Menu open/close must lock only the page behind it; the drawer remains scrollable.
          s = s.replace("function openMenu(){buildList();$('#drawer').classList.add('open');$('#backdrop').classList.remove('hide')}function closeMenu(){$('#drawer').classList.remove('open');$('#backdrop').classList.add('hide')}", "function openMenu(){buildList();document.documentElement.classList.add('menu-open');document.body.classList.add('menu-open');$('#drawer').classList.add('open');$('#backdrop').classList.remove('hide')}function closeMenu(){document.documentElement.classList.remove('menu-open');document.body.classList.remove('menu-open');$('#drawer').classList.remove('open');$('#backdrop').classList.add('hide')}")

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix retryable save validation and menu scrolling'
          git push
