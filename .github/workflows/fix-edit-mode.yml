name: Fix edit mode
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[portal-edit-patch]') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("let token=sessionStorage.getItem(TOKEN)||'',data=null,currentSigTarget=null,savedSigData=null;", "let token=sessionStorage.getItem(TOKEN)||'',data=null,currentSigTarget=null,savedSigData=null,editingVisitId=null;")
          s=s.replace("const v=(c.visits||[]).find(x=>String(x.assignment_id)===String(a.id));if(v){w.dataset.visitId=v.id||'';", "const savedVisit=(c.visits||[]).find(x=>String(x.assignment_id)===String(a.id));const v=(editingVisitId&&savedVisit&&String(savedVisit.id)===String(editingVisitId))?savedVisit:null;if(savedVisit)w.dataset.visitId=savedVisit.id||'';if(v){")
          old="e.querySelector('button').onclick=()=>{closeMenu();const t=document.querySelector('[data-visit-id=\"'+CSS.escape(v.id)+'\"]');if(t){t.scrollIntoView({behavior:'smooth'});t.style.outline='2px solid #2563eb';setTimeout(()=>t.style.outline='',1400)}}"
          new="e.querySelector('button').onclick=()=>{editingVisitId=v.id;closeMenu();render(data.campaigns||[]);requestAnimationFrame(()=>{const t=document.querySelector('[data-visit-id=\"'+CSS.escape(v.id)+'\"]');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.style.outline='2px solid #2563eb';setTimeout(()=>t.style.outline='',1400)}})}"
          if old not in s: raise SystemExit('edit handler pattern not found')
          s=s.replace(old,new)
          s=s.replace("$('#new').onclick=()=>{closeMenu();document.querySelector('.customer')?.scrollIntoView({behavior:'smooth'})};", "$('#new').onclick=()=>{editingVisitId=null;closeMenu();render(data.campaigns||[]);requestAnimationFrame(()=>document.querySelector('.customer')?.scrollIntoView({behavior:'smooth'}))};")
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'Metromite'
          git config user.email 'khaledehab3@gmail.com'
          git add index.html
          git commit -m 'Fix edit mode prefill behavior [portal-edit-patch]' || true
          git rm .github/workflows/fix-edit-mode.yml
          git commit -m 'Remove temporary edit patch workflow [portal-edit-patch]' || true
          git push