name: Correct validation guard regex
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor == 'Metromite'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct regex and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("/^[A-Za-zÀ-ÖØ-öø-ÿ\\\\s.'-]+$/", "/^[A-Za-zÀ-ÖØ-öø-ÿ\\s.'-]+$/")
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/fix-validation-guard-regex.yml
          git config user.name 'Metromite'
          git config user.email 'khaledehab3@gmail.com'
          git add index.html .github/workflows/fix-validation-guard-regex.yml
          git commit -m 'Correct pharmacist validation regex'
          git push