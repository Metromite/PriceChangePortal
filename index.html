<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>City Pharmacy • Price Change Portal</title>
<style>
:root{--bg:#07111f;--bg2:#0b1830;--glass:rgba(18,31,54,.64);--line:rgba(160,190,235,.16);--text:#f4f7fb;--muted:#9eacc3;--blue:#4f8cff;--cyan:#61d8ff;--green:#57e6a1;--red:#ff7184;--shadow:0 24px 70px rgba(0,0,0,.32)}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;width:100%;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f}html{min-height:100dvh;background:url("price-background.svg") center/cover fixed no-repeat}body{min-height:100dvh;background:linear-gradient(rgba(5,15,27,.48),rgba(5,15,27,.58)),url("price-background.svg") center/cover fixed no-repeat;overflow-x:hidden;position:relative}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent 35%,rgba(255,255,255,.02));backdrop-filter:blur(10px)}main{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:22px 0 48px;position:relative}.glass{background:linear-gradient(145deg,rgba(30,52,86,.68),rgba(10,22,40,.62));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 34px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.9);overflow:hidden;flex:0 0 auto}.logo img{width:100%;height:100%;object-fit:contain;display:block}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.customer{padding:18px;border-radius:18px;background:rgba(6,16,31,.34);border:1px solid rgba(160,190,235,.12);margin-top:12px}.customer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(79,140,255,.13);border:1px solid rgba(79,140,255,.25);font-size:12px;color:#cfe0ff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}.field.full{flex-basis:100%}label{font-size:12px;color:#c8d4e7}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,20,.46);color:var(--text);outline:none}input:focus,textarea:focus{border-color:rgba(79,140,255,.65);box-shadow:0 0 0 3px rgba(79,140,255,.1)}input[readonly]{opacity:.75}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.055);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:linear-gradient(135deg,#3d78ff,#49bfff);border-color:rgba(150,220,255,.35);font-weight:800}.btn.danger{color:#ffd3d8;border-color:rgba(255,113,132,.25)}.btn:disabled{opacity:.45;cursor:not-allowed}.item{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:14px;padding:14px 0;border-bottom:1px solid rgba(160,190,235,.1)}.item:last-child{border-bottom:0}.prices{font-size:12px;color:var(--muted);margin-top:5px}.qty{min-width:0}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.signature-wrap{height:150px;border:1px dashed rgba(160,190,235,.25);border-radius:14px;background:rgba(0,0,0,.18);overflow:hidden}.signature-wrap canvas{width:100%;height:100%;touch-action:none}.small{font-size:12px}.success{color:var(--green)}.error{color:var(--red)}.hide{display:none!important}.login{max-width:520px;margin:9vh auto 0}.login .glass{padding:28px;background:linear-gradient(145deg,rgba(24,51,87,.76),rgba(7,20,38,.72));box-shadow:0 30px 90px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}.remember{display:flex;align-items:center;gap:9px;color:#c8d4e7;font-size:13px;cursor:pointer}.remember input{width:auto}@media(max-width:760px){main{width:min(100% - 18px,1180px);padding-top:10px}.glass{border-radius:18px;padding:16px}.item{grid-template-columns:1fr 96px}.evidence{grid-template-columns:1fr}.top{align-items:flex-start}.top .btn{padding:8px 10px}}
</style>
</head>
<body><main>
<section id="login" class="login"><div class="glass"><div class="brand"><div class="logo"><img src="price-logo.svg" alt="City Pharmacy"></div><div><div class="eyebrow">City Pharmacy</div><h1 style="margin:2px 0 0;font-size:28px">Price Change Portal</h1></div></div><p class="muted" style="margin:18px 0">Sign in with your driver code. You will only see the customers assigned to you.</p><div class="grid"><div class="field"><label>Driver username</label><input id="u" autocomplete="username" autocapitalize="characters" placeholder="e.g. DRV001"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Enter password"></div><label class="remember"><input id="remember" type="checkbox"> Save username &amp; password on this device</label><div class="small muted">Your initial password is <b>driver</b>. Saving your password is optional.</div><button id="loginBtn" class="btn primary">Sign in</button><div id="loginMsg" class="small"></div></div></div></section>
<section id="app" class="hide"><div class="glass top"><div class="brand"><div class="logo"><img src="price-logo.svg" alt="City Pharmacy"></div><div><div class="eyebrow">Price Change Portal</div><h2 id="driverName" style="margin:2px 0 0"></h2><div id="driverMeta" class="muted small"></div></div></div><button id="logout" class="btn">Sign out</button></div><div id="campaigns" class="grid"></div></section>
</main>
<script>
const SUPABASE_URL='https://vyqyrcqrdsyrxywglqbh.supabase.co',SUPABASE_KEY='sb_publishable_CreQOVJ9ZYkp6PGBqWHlVA_q1CSur1n',TOKEN_KEY='dispatchops.driver.session',SAVED_USER_KEY='pricechange.saved.user',SAVED_PASS_KEY='pricechange.saved.pass';let token=sessionStorage.getItem(TOKEN_KEY)||'';const $=s=>document.querySelector(s),uEl=$('#u'),pEl=$('#p'),rememberEl=$('#remember');
const api=(path,body)=>fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||x.error||'Request failed');return x});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(e,t,ok=false)=>{e.textContent=t;e.className='small '+(ok?'success':'error')};
function loadSaved(){const u=localStorage.getItem(SAVED_USER_KEY)||'',p=localStorage.getItem(SAVED_PASS_KEY)||'';if(u&&p){uEl.value=u;pEl.value=p;rememberEl.checked=true}}function saveCreds(){if(rememberEl.checked){localStorage.setItem(SAVED_USER_KEY,uEl.value.trim());localStorage.setItem(SAVED_PASS_KEY,pEl.value)}else{localStorage.removeItem(SAVED_USER_KEY);localStorage.removeItem(SAVED_PASS_KEY)}}rememberEl.onchange=()=>{if(!rememberEl.checked){localStorage.removeItem(SAVED_USER_KEY);localStorage.removeItem(SAVED_PASS_KEY)}};
async function load(){const x=await api('/rest/v1/rpc/dispatchops_driver_data',{p_token:token});if(!x?.driver)throw Error('Session expired');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#driverName').textContent=x.driver.name||x.driver.code;$('#driverMeta').textContent=[x.driver.code,x.driver.division].filter(Boolean).join(' · ');render(x.campaigns||[])}
function render(cs){const root=$('#campaigns');root.innerHTML='';if(!cs.length){root.innerHTML='<div class="glass"><h3>No open price-revision list</h3><p class="muted">Nothing has been assigned to your driver account yet.</p></div>';return}for(const c of cs){const card=document.createElement('section');card.className='glass';card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><div class="muted small">Document: '+esc(c.campaign.document_date||'—')+' · Effective: '+esc(c.campaign.effective_date||'—')+' · '+esc(c.campaign.decree_numbers||'')+'</div><div class="customers"></div>';const host=card.querySelector('.customers');for(const a of c.assignments||[])renderCustomer(host,c,a);root.appendChild(card)}}
function renderCustomer(host,c,a){const wrap=document.createElement('div');wrap.className='customer';const lock=a.location_locked?'Location locked by admin':'Location can be entered by driver';wrap.innerHTML='<div class="customer-head"><div><div class="eyebrow">Customer</div><h3 class="ctitle" style="margin:4px 0">'+(esc(a.customer_name)||'Customer name required')+'</h3><span class="pill">'+esc(lock)+'</span></div><div class="small muted">'+(a.telephone?esc(a.telephone):'Telephone optional')+'</div></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacy / Customer name <b style="color:var(--red)">*</b></label><input class="customer-name" value="'+esc(a.customer_name)+'" placeholder="Enter pharmacy name"></div><div class="field"><label>Location <b style="color:var(--red)">*</b></label><input class="location" value="'+esc(a.location)+'" '+(a.location_locked?'readonly':'')+' placeholder="Enter location"></div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="telephone" value="'+esc(a.telephone||'')+'" placeholder="Optional"></div></div><div class="items"></div><div class="evidence" style="margin-top:14px"><div class="field"><label>Pharmacist name <b style="color:var(--red)">*</b></label><input class="pharmacist" placeholder="Required before submit"></div><div class="field"><label>Pharmacy / place photo <b style="color:var(--red)">*</b></label><input class="photo" type="file" accept="image/*"><div class="small muted">Required for every saved visit.</div></div></div><div style="margin-top:12px"><label style="display:flex;align-items:center;gap:9px;font-weight:700"><input class="no-stock" type="checkbox"> No Stock — nothing repriced at this customer</label><div class="small muted">Use this only when no item was repriced.</div></div><div style="margin-top:12px"><label>Signature / Stamp <span class="muted">optional</span></label><div class="signature-wrap"><canvas class="signature"></canvas></div><div class="row" style="margin-top:6px"><button class="btn clear-sign" type="button">Clear signature</button></div></div><div class="field" style="margin-top:12px"><label>Notes <span class="muted">optional</span></label><textarea class="notes" rows="2"></textarea></div><div class="row" style="margin-top:14px"><button class="btn primary save" type="button">Save / Submit</button><button class="btn danger delete hide" type="button">Delete my submission</button><span class="msg small"></span></div>';const ih=wrap.querySelector('.items'),assigned=new Set((c.assignment_items||[]).filter(x=>x.assignment_id===a.id).map(x=>x.item_id));for(const item of c.items||[]){if(!assigned.has(item.id))continue;const r=document.createElement('div');r.className='item';r.innerHTML='<div><strong>'+esc(item.line_no)+'. '+esc(item.item_description)+'</strong><div class="prices">Old Pharmacy: '+esc(item.old_pharmacy_price??'—')+' · Old Public: '+esc(item.old_public_price??'—')+'<br>New Pharmacy: '+esc(item.new_pharmacy_price??'—')+' · New Public: '+esc(item.new_public_price??'—')+'</div></div><div class="field qty"><label>Qty</label><input class="qty-input" data-item="'+item.id+'" type="number" min="0" step="1" value=""></div>';ih.appendChild(r)}setupSignature(wrap.querySelector('.signature'),wrap.querySelector('.clear-sign'));const existing=(c.visits||[]).find(v=>v.assignment_id===a.id||v.customer_name===a.customer_name);if(existing){wrap.dataset.visitId=existing.id||'';wrap.dataset.attachmentPath=existing.attachment_path||'';wrap.querySelector('.pharmacist').value=existing.pharmacist_name||'';wrap.querySelector('.notes').value=existing.notes||'';if(existing.status==='NO_STOCK')wrap.querySelector('.no-stock').checked=true;wrap.querySelector('.telephone').value=existing.telephone||a.telephone||'';for(const vi of existing.price_change_visit_items||[]){const q=wrap.querySelector('[data-item="'+vi.item_id+'"]');if(q)q.value=vi.quantity??0}wrap.querySelector('.delete').classList.remove('hide')}wrap.querySelector('.save').onclick=()=>saveVisit(c,a,wrap);wrap.querySelector('.delete').onclick=async()=>{if(!wrap.dataset.visitId||!confirm('Delete your submission?'))return;try{await api('/rest/v1/rpc/dispatchops_driver_delete_visit',{p_token:token,p_visit_id:wrap.dataset.visitId});msg(wrap.querySelector('.msg'),'Submission deleted. Refreshing…',true);await load()}catch(e){msg(wrap.querySelector('.msg'),e.message)}};host.appendChild(wrap)}
function setupSignature(canvas,clear){const ctx=canvas.getContext('2d');let drawing=false;const resize=()=>{const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.scale(d,d);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#e9f2ff'};resize();new ResizeObserver(resize).observe(canvas);const pos=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));clear.onclick=()=>ctx.clearRect(0,0,canvas.width,canvas.height)}function canvasData(canvas){const a=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;for(let i=3;i<a.length;i+=4)if(a[i]>0)return canvas.toDataURL('image/png');return null}
async function saveVisit(c,a,w){const m=w.querySelector('.msg');msg(m,'Saving…',true);const name=w.querySelector('.customer-name').value.trim(),location=w.querySelector('.location').value.trim(),pharm=w.querySelector('.pharmacist').value.trim(),noStock=w.querySelector('.no-stock').checked;if(!name||!location||!pharm){msg(m,'Customer name, location and pharmacist name are required.');return}const qs=[...w.querySelectorAll('.qty-input')],vals=qs.map(x=>x.value.trim()===''?0:Number(x.value));if(vals.some(x=>!Number.isInteger(x)||x<0)){msg(m,'Quantities must be whole numbers 0 or greater.');return}if(!noStock&&!vals.some(x=>x>0)){msg(m,'Enter a quantity greater than 0, or select No Stock.');return}if(noStock&&vals.some(x=>x>0)){msg(m,'No Stock cannot be selected with a quantity.');return}const items=qs.map(x=>({item_id:x.dataset.item,quantity:Number(x.value||0)}));const photo=w.querySelector('.photo').files[0];let attachment_path=null,signature_path=null;try{if(photo)attachment_path=await uploadFile(photo,'photo');else if(!w.dataset.attachmentPath){msg(m,'A pharmacy/place photo is required before saving.');return}const sig=canvasData(w.querySelector('.signature'));if(sig)signature_path=await uploadBase64(sig,'signature.png','image/png','signature');const payload={id:w.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location,telephone:w.querySelector('.telephone').value.trim(),pharmacist_name:pharm,notes:w.querySelector('.notes').value.trim(),attachment_path,signature_path,status:noStock?'NO_STOCK':'SUBMITTED',items};const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:payload});w.dataset.visitId=r.visit_id;w.dataset.attachmentPath=attachment_path||w.dataset.attachmentPath||'';w.querySelector('.delete').classList.remove('hide');msg(m,noStock?'Saved — No Stock. Server date/time recorded.':'Saved successfully. Server date/time recorded.',true)}catch(e){msg(m,e.message||'Could not save')}}async function uploadFile(file,kind){const data=await compress(file);return uploadBase64(data,file.name,file.type,kind)}async function uploadBase64(data,name,type,kind){const r=await fetch(SUPABASE_URL+'/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({token,filename:name,content_type:type,base64:data,kind})});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||'Evidence upload failed');return x.path}function compress(file){return new Promise((res,rej)=>{const im=new Image(),rd=new FileReader();rd.onload=()=>{im.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,im.width*s);cv.height=Math.max(1,im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.76).split(',')[1])};im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
$('#loginBtn').onclick=async()=>{const m=$('#loginMsg'),username=uEl.value.trim(),password=pEl.value;if(!username||!password){msg(m,'Username and password are required.');return}m.textContent='Signing in…';try{const x=await api('/rest/v1/rpc/dispatchops_driver_login',{p_username:username,p_password:password});token=x.token;sessionStorage.setItem(TOKEN_KEY,token);saveCreds();await load()}catch(e){msg(m,e.message||'Invalid username or password')}};$('#logout').onclick=async()=>{try{if(token)await api('/rest/v1/rpc/dispatchops_driver_logout',{p_token:token})}catch{}sessionStorage.removeItem(TOKEN_KEY);token='';location.reload()};loadSaved();if(token)load().catch(()=>{sessionStorage.removeItem(TOKEN_KEY);token=''});
</script></body></html>
