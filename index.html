<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>City Pharmacy • Price Change Portal</title><style>:root{--bg:#07111f;--bg2:#0b1830;--glass:rgba(18,31,54,.68);--line:rgba(160,190,235,.16);--text:#f4f7fb;--muted:#9eacc3;--blue:#4f8cff;--cyan:#61d8ff;--green:#57e6a1;--red:#ff7184}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,#163663,transparent 35%),radial-gradient(circle at 90% 10%,#10385b,transparent 32%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed}main{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 48px}.glass{background:linear-gradient(145deg,rgba(30,52,86,.68),rgba(10,22,40,.62));border:1px solid var(--line);box-shadow:0 24px 70px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.05);backdrop-filter:blur(22px);border-radius:22px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:15px;object-fit:contain;background:#fff;padding:5px;display:block}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.customer{padding:18px;border-radius:18px;background:rgba(6,16,31,.34);border:1px solid rgba(160,190,235,.12);margin-top:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}label{font-size:13px;color:#c8d4e7}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,20,.46);color:var(--text);outline:none}.locked{padding:12px 13px;border-radius:12px;border:1px solid rgba(87,230,161,.24);background:rgba(87,230,161,.06);min-height:46px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.055);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:linear-gradient(135deg,#3d78ff,#49bfff);font-weight:800}.danger{color:#ffd3d8}.hide{display:none!important}.item{display:grid;grid-template-columns:1fr 130px;gap:14px;padding:14px 0;border-bottom:1px solid rgba(160,190,235,.1)}.qty{font-size:21px!important;font-weight:900;text-align:center;min-height:54px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sig{height:150px;border:1px dashed rgba(160,190,235,.25);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.18)}.sig canvas{width:100%;height:100%;display:block;touch-action:none}.no-stock{padding:18px;border:1px solid rgba(97,216,255,.22);border-radius:14px;background:rgba(79,140,255,.07)}.no-stock label{font-size:19px;font-weight:900;display:flex;gap:10px;align-items:center}.no-stock input{width:26px;height:26px}.login{max-width:560px;margin:7vh auto}.login-logo{width:110px;height:110px;border-radius:20px;background:#fff;padding:8px;object-fit:contain}.menu{width:48px;height:48px;padding:0;font-size:25px}.drawer{position:fixed;z-index:50;right:0;top:0;width:min(370px,90vw);height:100vh;padding:18px;background:rgba(8,18,34,.97);border-left:1px solid var(--line);box-shadow:-25px 0 60px rgba(0,0,0,.35);backdrop-filter:blur(22px);transform:translateX(105%);transition:.2s;overflow:auto}.drawer.open{transform:translateX(0)}.backdrop{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.4)}.menuitem{width:100%;justify-content:flex-start;margin-top:8px;font-weight:800}.submission{padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.035)}.toast{position:fixed;z-index:80;left:50%;bottom:22px;transform:translateX(-50%);padding:12px 16px;border-radius:14px;background:#09162a;border:1px solid var(--line)}.ok{color:var(--green)}.err{color:var(--red)}@media(max-width:760px){main{width:calc(100% - 14px);padding-top:8px}.glass{border-radius:18px;padding:16px}.item{grid-template-columns:1fr 100px}.evidence{grid-template-columns:1fr}.logo{width:50px;height:50px}}</style></head><body><main>
<section id="login" class="login"><div class="glass"><div style="text-align:center"><img class="login-logo" src="price-logo.svg" alt="City Pharmacy"><div class="eyebrow" style="margin-top:14px">City Pharmacy</div><h1 style="margin:4px 0;font-size:30px">Price Change Portal</h1><p class="muted">Sign in with your driver code to complete your assigned price changes.</p></div><div class="grid"><div class="field"><label>Driver username</label><input id="u" autocomplete="username" autocapitalize="characters" placeholder="e.g. DRV001"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Password"></div><label><input id="remember" type="checkbox" style="width:18px;height:18px;margin-right:7px"> Save username &amp; password on this device</label><div class="small muted">Initial password: <b>driver</b></div><button id="loginBtn" class="btn primary">Sign in</button><div id="loginMsg" class="small"></div></div></div></section>
<section id="app" class="hide"><div class="glass top"><div class="brand"><img class="logo" src="price-logo.svg" alt="City Pharmacy"><div><div class="eyebrow">Driver Price Change Portal</div><h2 id="driverName" style="margin:2px 0"></h2><div id="driverMeta" class="muted small"></div></div></div><div class="row"><button id="menuBtn" class="btn menu" aria-label="Menu">☰</button><button id="logout" class="btn">Sign out</button></div></div><div id="campaigns" class="grid"></div></section></main>
<div id="backdrop" class="backdrop hide"></div><aside id="drawer" class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Menu</h2><button id="close" class="btn">Close</button></div><button id="new" class="btn primary menuitem">＋ New submission</button><button id="mine" class="btn menuitem">✓ My submitted visits</button><button id="refresh" class="btn menuitem">↻ Refresh assignments</button><div id="list" style="margin-top:18px"></div></aside><div id="toast" class="toast hide"></div>
<script>
const URL='https://vyqyrcqrdsyrxywglqbh.supabase.co',KEY='sb_publishable_CreQOVJ9ZYkp6PGBqWHlVA_q1CSur1n',TOKEN='dispatchops.driver.session',CREDS='dispatchops.driver.credentials';let token=sessionStorage.getItem(TOKEN)||'',data=null;$=s=>document.querySelector(s);const api=(p,b)=>fetch(URL+p,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||x.error||'Request failed');return x});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2200)};const setmsg=(e,t,ok)=>{e.textContent=t;e.className='small '+(ok?'ok':'err')};
function openMenu(){buildList();$('#drawer').classList.add('open');$('#backdrop').classList.remove('hide')}function closeMenu(){ $('#drawer').classList.remove('open');$('#backdrop').classList.add('hide')}
async function load(){data=await api('/rest/v1/rpc/dispatchops_driver_data',{p_token:token});if(!data?.driver)throw Error('Session expired');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#driverName').textContent=data.driver.name||data.driver.code;$('#driverMeta').textContent=[data.driver.code,data.driver.division].filter(Boolean).join(' · ');render(data.campaigns||[]);buildList()}
function render(cs){const root=$('#campaigns');root.innerHTML='';if(!cs.length){root.innerHTML='<div class="glass"><h3>No open price-change list</h3><p class="muted">Nothing has been assigned to your driver account yet.</p></div>';return}for(const c of cs){const card=document.createElement('section');card.className='glass';card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><div class="muted small">Server date/time is recorded automatically on save.</div><div class="customers"></div>';for(const a of c.assignments||[])renderCustomer(card.querySelector('.customers'),c,a);root.appendChild(card)}}
function renderCustomer(host,c,a){const w=document.createElement('div');w.className='customer';w.dataset.assignmentId=a.id;const v=(c.visits||[]).find(x=>x.assignment_id===a.id);if(v){w.dataset.visitId=v.id||'';w.dataset.attachment=v.attachment_path||''}const locked=!!a.location_locked;w.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="eyebrow">Assigned customer</div><h3 style="margin:4px 0">'+(esc(a.customer_name)||'Customer name required')+'</h3><span class="small">'+(locked?'🔒 Location locked by admin':'Location editable by driver')+'</span></div></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacy / Customer name *</label><input class="customer" value="'+esc(v?.customer_name||a.customer_name)+'" placeholder="Enter pharmacy name"></div><div class="field"><label>Location *</label>'+(locked?'<div class="locked">🔒 '+esc(a.location||'Location locked by admin')+'</div><input class="location" type="hidden" value="'+esc(a.location)+'">':'<input class="location" value="'+esc(v?.location||a.location)+'" placeholder="Enter location">')+'</div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="tel" value="'+esc(v?.telephone||a.telephone||'')+'"></div></div><div class="items"></div><div class="evidence" style="margin-top:14px"><div class="field"><label>Pharmacist name *</label><input class="pharm" value="'+esc(v?.pharmacist_name||'')+'" placeholder="Required"></div><div class="field"><label>Pharmacy / place photo *</label><input class="photo" type="file" accept="image/*"><div class="small muted">Required for first save; existing saved photo is reused on edit.</div></div></div><div class="no-stock" style="margin-top:12px"><label><input class="nostock" type="checkbox" '+(v?.status==='NO_STOCK'?'checked':'')+'> No Stock — nothing repriced</label></div><div style="margin-top:12px"><label>Signature / Stamp <span class="muted">optional</span></label><div class="sig"><canvas class="signature"></canvas></div><div style="margin-top:7px"><button class="btn clear" type="button">Clear signature</button></div></div><div class="field" style="margin-top:12px"><label>Notes <span class="muted">optional</span></label><textarea class="notes" rows="2">'+esc(v?.notes||'')+'</textarea></div><div class="row" style="margin-top:14px"><button class="btn primary save" type="button">Save / Submit visit</button><button class="btn danger del '+(v?'':'hide')+'" type="button">Delete my submission</button><span class="msg small"></span></div>';const assigned=new Set((c.assignment_items||[]).filter(x=>x.assignment_id===a.id).map(x=>x.item_id));for(const i of c.items||[]){if(!assigned.has(i.id))continue;const old=(v?.price_change_visit_items||[]).find(x=>x.item_id===i.id),r=document.createElement('div');r.className='item';r.innerHTML='<div><strong>'+esc(i.line_no)+'. '+esc(i.item_description)+'</strong><div class="muted small">New Price: '+esc(i.new_public_price??i.new_pharmacy_price??'—')+'</div></div><input class="qty" data-item="'+i.id+'" type="number" min="0" step="1" value="'+(old?.quantity??'')+'">';w.querySelector('.items').appendChild(r)}setupSig(w.querySelector('.signature'),w.querySelector('.clear'));w.querySelector('.save').onclick=()=>saveVisit(c,a,w);w.querySelector('.del').onclick=async()=>{if(!w.dataset.visitId||!confirm('Delete your submission?'))return;try{await api('/rest/v1/rpc/dispatchops_driver_delete_visit',{p_token:token,p_visit_id:w.dataset.visitId});toast('Submission deleted');await load()}catch(e){setmsg(w.querySelector('.msg'),e.message)}};host.appendChild(w)}
function setupSig(cv,btn){const bind=(c,b)=>{const ctx=c.getContext('2d'),d=Math.max(1,devicePixelRatio||1),resize=()=>{const r=c.getBoundingClientRect(),W=Math.max(1,Math.round(r.width*d)),H=Math.max(1,Math.round(r.height*d));if(c.width!==W||c.height!==H){c.width=W;c.height=H}ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#e9f2ff'};resize();let drawing=false;c.onpointerdown=e=>{drawing=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)};c.onpointermove=e=>{if(!drawing)return;const r=c.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()};['pointerup','pointercancel','pointerleave'].forEach(n=>c.addEventListener(n,()=>drawing=false));b.onclick=()=>{const fresh=c.cloneNode(false);fresh.width=1;fresh.height=1;c.replaceWith(fresh);bind(fresh,b);}};bind(cv,btn)}
function sigData(c){const a=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<a.length;i+=4)if(a[i])return c.toDataURL('image/png');return null}
function compress(f){return new Promise((res,rej)=>{const im=new Image(),rd=new FileReader();rd.onload=()=>{im.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*s);c.height=Math.max(1,im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.76))};im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(f)})}
async function upload(data,name,type,kind){const raw=String(data||'').replace(/^data:[^,]*,/,'').replace(/\s/g,'');if(!raw)throw Error('Evidence data is empty');const r=await fetch(URL+'/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token,filename:name,content_type:type,base64:raw,kind})}),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||x.message||'Evidence upload failed');return x.path}
async function saveVisit(c,a,w){const m=w.querySelector('.msg');setmsg(m,'Saving…',true);const name=w.querySelector('.customer').value.trim(),loc=w.querySelector('.location').value.trim(),ph=w.querySelector('.pharm').value.trim(),ns=w.querySelector('.nostock').checked;if(!name)return setmsg(m,'Customer name is required.');if(!loc)return setmsg(m,'Location is required.');if(!ph)return setmsg(m,'Pharmacist name is required.');const qs=[...w.querySelectorAll('.qty')],vals=qs.map(x=>x.value.trim()===''?0:Number(x.value));if(vals.some(x=>!Number.isInteger(x)||x<0))return setmsg(m,'Quantities must be whole numbers 0 or greater.');if(!ns&&!vals.some(x=>x>0))return setmsg(m,'Enter a quantity or select No Stock.');if(ns&&vals.some(x=>x>0))return setmsg(m,'No Stock cannot be selected with a quantity.');try{let photo=w.querySelector('.photo').files[0],path=w.dataset.attachment||null;if(photo)path=await upload(await compress(photo),photo.name,photo.type,'photo');else if(!path)throw Error('A pharmacy/place photo is required before saving.');const sig=sigData(w.querySelector('.signature'));let sp=null;if(sig)sp=await upload(sig,'signature.png','image/png','signature');const items=qs.map(x=>({item_id:x.dataset.item,quantity:Number(x.value||0)}));const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:{id:w.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location:loc,telephone:w.querySelector('.tel').value.trim(),pharmacist_name:ph,notes:w.querySelector('.notes').value.trim(),attachment_path:path,signature_path:sp,status:ns?'NO_STOCK':'SUBMITTED',items}});w.dataset.visitId=r.visit_id;w.dataset.attachment=path||'';w.querySelector('.del').classList.remove('hide');setmsg(m,'Saved successfully. Server date/time recorded.',true);toast('Visit saved successfully');await load()}catch(e){setmsg(m,e.message||'Could not save')}}
function buildList(){const root=$('#list');if(!root||!data)return;const vs=(data.campaigns||[]).flatMap(c=>(c.visits||[]).map(v=>({...v,c})));root.innerHTML='<div class="eyebrow">My submitted visits</div>';if(!vs.length){root.innerHTML+='<p class="muted small">No submissions yet.</p>';return}for(const v of vs){const e=document.createElement('div');e.className='submission';e.innerHTML='<strong>'+esc(v.customer_name||'Unnamed customer')+'</strong><div class="small muted">'+esc(v.location||'')+' · '+esc(v.status||'SUBMITTED')+'</div><div class="small muted">'+(v.visited_at?new Date(v.visited_at).toLocaleString():'')+'</div><button class="btn menuitem">Edit this visit</button>';e.querySelector('button').onclick=()=>{closeMenu();const t=document.querySelector('[data-visit-id="'+CSS.escape(v.id)+'"]');if(t){t.scrollIntoView({behavior:'smooth'});t.style.outline='2px solid var(--cyan)';setTimeout(()=>t.style.outline='',1400)}};root.appendChild(e)}}
$('#menuBtn').onclick=openMenu;$('#close').onclick=closeMenu;$('#backdrop').onclick=closeMenu;$('#new').onclick=()=>{closeMenu();document.querySelector('.customer')?.scrollIntoView({behavior:'smooth'})};$('#mine').onclick=buildList;$('#refresh').onclick=()=>load().catch(e=>toast(e.message));$('#loginBtn').onclick=async()=>{try{const username=$('#u').value.trim(),password=$('#p').value;if(!username||!password)throw Error('Enter username and password');const x=await api('/rest/v1/rpc/dispatchops_driver_login',{p_username:username,p_password:password});token=x.token;sessionStorage.setItem(TOKEN,token);if($('#remember').checked)localStorage.setItem(CREDS,JSON.stringify({username,password}));else localStorage.removeItem(CREDS);await load()}catch(e){setmsg($('#loginMsg'),e.message)}};$('#logout').onclick=()=>{sessionStorage.removeItem(TOKEN);location.reload()};try{const c=JSON.parse(localStorage.getItem(CREDS)||'null');if(c?.username){$('#u').value=c.username;$('#p').value=c.password||'';$('#remember').checked=true}}catch{}if(token)load().catch(()=>sessionStorage.removeItem(TOKEN));
</script></body></html>
