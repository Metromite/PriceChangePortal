<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DispatchOPS • Driver Portal</title>
<style>
:root{--bg:#07111f;--bg2:#0b1830;--glass:rgba(18,31,54,.68);--line:rgba(160,190,235,.16);--text:#f4f7fb;--muted:#9eacc3;--blue:#4f8cff;--cyan:#61d8ff;--green:#57e6a1;--red:#ff7184;--shadow:0 24px 70px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,#163663 0,transparent 35%),radial-gradient(circle at 90% 10%,#10385b 0,transparent 32%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent 35%,rgba(255,255,255,.02));backdrop-filter:blur(10px)}main{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 48px;position:relative}.glass{background:linear-gradient(145deg,rgba(30,52,86,.68),rgba(10,22,40,.62));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#eee;display:block;box-shadow:0 10px 30px rgba(50,117,255,.25)}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.customer{padding:18px;border-radius:18px;background:rgba(6,16,31,.34);border:1px solid rgba(160,190,235,.12);margin-top:12px}.customer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(79,140,255,.13);border:1px solid rgba(79,140,255,.25);font-size:12px;color:#cfe0ff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}label{font-size:13px;color:#c8d4e7}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,20,.46);color:var(--text);outline:none}input:focus,textarea:focus{border-color:rgba(79,140,255,.65);box-shadow:0 0 0 3px rgba(79,140,255,.1)}input[readonly],.locked-location{opacity:.85}.locked-location{padding:12px 13px;border-radius:12px;border:1px solid rgba(87,230,161,.24);background:rgba(87,230,161,.06);min-height:46px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.055);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:linear-gradient(135deg,#3d78ff,#49bfff);border-color:rgba(150,220,255,.35);font-weight:800}.btn.danger{color:#ffd3d8;border-color:rgba(255,113,132,.25)}.btn:disabled{opacity:.45;cursor:not-allowed}.item{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px;padding:14px 0;border-bottom:1px solid rgba(160,190,235,.1)}.item:last-child{border-bottom:0}.prices{font-size:13px;color:var(--muted);margin-top:5px}.qty-input{font-size:21px!important;font-weight:900;text-align:center;padding:15px!important;min-height:54px}.no-stock-box{padding:18px 18px}.no-stock-label{font-size:19px!important;min-height:30px}.no-stock-label input{width:26px!important;height:26px!important}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.signature-wrap{height:150px;border:1px dashed rgba(160,190,235,.25);border-radius:14px;background:#fff;overflow:hidden}.signature-wrap canvas{width:100%;height:100%;touch-action:none;display:block}.small{font-size:12px}.success{color:var(--green)}.error{color:var(--red)}.hide{display:none!important}.login{max-width:560px;margin:7vh auto 0}.login .glass{padding:28px}.login-logo{width:92px;height:110px;border-radius:20px;object-fit:contain;background:#fff;box-shadow:0 16px 40px rgba(50,117,255,.25)}.menu-btn{width:48px;height:48px;padding:0;font-size:25px;border-radius:14px}.drawer{position:fixed;z-index:50;top:0;right:0;width:min(360px,88vw);height:100vh;padding:18px;background:rgba(8,18,34,.96);border-left:1px solid var(--line);box-shadow:-25px 0 60px rgba(0,0,0,.35);backdrop-filter:blur(22px);transform:translateX(105%);transition:transform .2s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-backdrop{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.38);backdrop-filter:blur(2px)}.menu-item{width:100%;justify-content:flex-start;padding:14px 15px;margin-top:8px;font-weight:700}.submission{padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.035)}.no-stock-box{padding:15px 16px;border:1px solid rgba(97,216,255,.22);border-radius:14px;background:rgba(79,140,255,.07)}.no-stock-label{font-size:16px!important;font-weight:800!important;display:flex;align-items:center;gap:11px}.no-stock-label input{width:22px;height:22px;accent-color:#4f8cff;flex:0 0 auto}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toast{position:fixed;z-index:80;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,90vw);padding:12px 16px;border-radius:14px;background:rgba(9,22,42,.95);border:1px solid var(--line);box-shadow:var(--shadow)}@media(max-width:760px){main{width:min(100% - 14px,1180px);padding-top:8px}.glass{border-radius:18px;padding:16px}.item{grid-template-columns:1fr 100px}.evidence{grid-template-columns:1fr}.top{align-items:flex-start}.top .btn{padding:9px 11px}.brand-logo{width:50px;height:50px}}
</style></head><body><main>
<section id="login" class="login"><div class="glass"><div style="text-align:center"><div style="display:flex;justify-content:center;margin-bottom:16px"><img class="login-logo" src="data:image/png;base64,PLACEHOLDER_LOGO_BASE64" alt="City Pharmacy"></div><div class="eyebrow" style="margin-top:14px">City Pharmacy</div><h1 style="margin:4px 0;font-size:30px">Price Change Portal</h1><p class="muted">Sign in with your driver code to complete your assigned price changes.</p></div><div class="grid"><div class="field"><label>Driver username</label><input id="u" autocomplete="username" autocapitalize="characters" placeholder="e.g. T046"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Password"></div><label><input id="remember" type="checkbox" style="width:18px;height:18px;margin-right:7px"> Save username &amp; password on this device</label><div class="small muted">Password format: <b>driver + your driver code</b> (example: <b>driverT046</b>)</div><button id="loginBtn" class="btn primary">Sign in</button><div id="loginMsg" class="small"></div></div></div></section>
<section id="app" class="hide"><div class="glass top"><div class="brand"><img class="brand-logo" src="data:image/png;base64,PLACEHOLDER_LOGO_BASE64" alt="City Pharmacy"><div><div class="eyebrow">Driver Price Change Portal</div><h2 id="driverName" style="margin:2px 0"></h2><div id="driverMeta" class="muted small"></div></div></div><div class="row"><button id="menuBtn" class="btn menu-btn" aria-label="Menu">☰</button><button id="logout" class="btn">Sign out</button></div></div><div id="campaigns" class="grid"></div></section></main>
<div id="backdrop" class="drawer-backdrop hide"></div><aside id="drawer" class="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Menu</h2><button id="close" class="btn">Close</button></div><button id="new" class="btn primary menu-item">＋ New submission</button><button id="mine" class="btn menu-item">✓ My submitted visits</button><button id="refresh" class="btn menu-item">↻ Refresh assignments</button><div id="list" style="margin-top:18px"></div></aside><div id="toast" class="toast hide"></div>
<script>
const URL='https://vyqyrcqrdsyrxywglqbh.supabase.co',KEY='sb_publishable_CreQOVJ9ZYkp6PGBqWHlVA_q1CSur1n',TOKEN='dispatchops.driver.session',CREDS='dispatchops.driver.credentials';let token=sessionStorage.getItem(TOKEN)||'',data=null;$=s=>document.querySelector(s);const api=(p,b)=>fetch(URL+p,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||x.error||'Request failed');return x});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const toast=t=>{$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2200)};const setmsg=(e,t,ok)=>{e.textContent=t;e.className='small '+(ok?'success':'error')};
function openMenu(){buildList();$('#drawer').classList.add('open');$('#backdrop').classList.remove('hide')}function closeMenu(){$('#drawer').classList.remove('open');$('#backdrop').classList.add('hide')}
async function load(){data=await api('/rest/v1/rpc/dispatchops_driver_data',{p_token:token});if(!data?.driver)throw Error('Session expired');$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#driverName').textContent=data.driver.name||data.driver.code;$('#driverMeta').textContent=[data.driver.code,data.driver.division].filter(Boolean).join(' · ');render(data.campaigns||[]);buildList()}
function render(cs){const root=$('#campaigns');root.innerHTML='';if(!cs.length){root.innerHTML='<div class="glass"><h3>No open price-change list</h3><p class="muted">Nothing has been assigned to your driver account yet.</p></div>';return}for(const c of cs){const card=document.createElement('section');card.className='glass';card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><div class="muted small">Server date/time is recorded automatically on save.</div><div class="customers"></div>';for(const a of c.assignments||[])renderCustomer(card.querySelector('.customers'),c,a);root.appendChild(card)}}
function renderCustomer(host,c,a){const w=document.createElement('div');w.className='customer';w.dataset.assignmentId=a.id;const v=(c.visits||[]).find(x=>x.assignment_id===a.id);if(v){w.dataset.visitId=v.id||'';w.dataset.attachmentPath=v.attachment_path||''}const locked=!!a.location_locked;w.innerHTML='<div class="customer-head"><div><div class="eyebrow">Assigned customer</div><h3 style="margin:4px 0">'+(esc(a.customer_name)||'Customer name required')+'</h3><span class="pill">'+(locked?'🔒 Location locked by admin':'Location editable by driver')+'</span></div></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacy / Customer name *</label><input class="customer-name" value="'+esc(v?.customer_name||a.customer_name)+'" placeholder="Enter pharmacy name"></div><div class="field"><label>Location *</label>'+(locked?'<div class="locked-location">🔒 '+esc(a.location||'Location locked by admin')+'</div><input class="location" type="hidden" value="'+esc(a.location)+'">':'<input class="location" value="'+esc(v?.location||a.location)+'" placeholder="Enter location">')+'</div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="telephone" value="'+esc(v?.telephone||a.telephone||'')+'"></div></div><div class="items"></div><div class="evidence" style="margin-top:14px"><div class="field"><label>Pharmacist name *</label><input class="pharmacist" value="'+esc(v?.pharmacist_name||'')+'" placeholder="Required"></div><div class="field"><label>Pharmacy / place photo *</label><input class="photo" type="file" accept="image/*"><div class="small muted">Required for first save; existing saved photo is reused on edit.</div></div></div><div class="no-stock-box" style="margin-top:12px"><label class="no-stock-label"><input class="no-stock" type="checkbox" '+(v?.status==='NO_STOCK'?'checked':'')+'> No Stock — nothing repriced</label></div><div style="margin-top:12px"><label>Signature / Stamp <span class="muted">optional</span></label><div class="signature-wrap"><canvas class="signature"></canvas></div><div style="margin-top:7px"><button class="btn clear-signature" type="button">Clear signature</button></div></div><div class="field" style="margin-top:12px"><label>Notes <span class="muted">optional</span></label><textarea class="notes" rows="2">'+esc(v?.notes||'')+'</textarea></div><div class="row" style="margin-top:14px"><button class="btn primary save" type="button">Save / Submit visit</button><button class="btn danger delete '+(v?'':'hide')+'" type="button">Delete my submission</button><span class="msg small"></span></div>';const assigned=new Set((c.assignment_items||[]).filter(x=>x.assignment_id===a.id).map(x=>x.item_id));for(const i of c.items||[]){if(!assigned.has(i.id))continue;const old=(v?.price_change_visit_items||[]).find(x=>x.item_id===i.id),r=document.createElement('div');r.className='item';r.innerHTML='<div><strong>'+esc(i.line_no)+'. '+esc(i.item_description)+'</strong><div class="prices">New Price: '+esc(i.new_public_price??i.new_pharmacy_price??'—')+'</div></div><input class="qty-input" data-item="'+i.id+'" type="number" min="0" step="1" value="'+(old?.quantity??'')+'">';w.querySelector('.items').appendChild(r)}setupSignature(w.querySelector('.signature'),w.querySelector('.clear-signature'),w.querySelector('.msg'));w.querySelector('.save').onclick=()=>saveVisit(c,a,w);w.querySelector('.delete').onclick=async()=>{if(!w.dataset.visitId||!confirm('Delete your submission?'))return;try{await api('/rest/v1/rpc/dispatchops_driver_delete_visit',{p_token:token,p_visit_id:w.dataset.visitId});toast('Submission deleted');await load()}catch(e){setmsg(w.querySelector('.msg'),e.message)}};host.appendChild(w)}
function setupSignature(canvas,clear,status){const ctx=canvas.getContext('2d');const d=Math.max(1,window.devicePixelRatio||1);const resize=()=>{const r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111'};resize();let drawing=false;canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const r=canvas.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const r=canvas.getBoundingClientRect();ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke()});['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n,()=>drawing=false));clear.onclick=()=>{ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';toast('Signature cleared')};}
function canvasData(c){const a=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<a.length;i+=4)if(a[i]>0)return c.toDataURL('image/png');return null}
function base64FromDataUrl(s){return String(s||'').split(',')[1]||''}
async function uploadBase64(dataUrl,filename,contentType,kind){const b=base64FromDataUrl(dataUrl);const r=await fetch('https://vyqyrcqrdsyrxywglqbh.supabase.co/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token,filename,content_type:contentType,base64:b,kind})});const x=await r.json().catch(()=>({}));if(!r.ok||x.error)throw Error(x.error||'Upload failed');return x.path}
function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),reader=new FileReader();reader.onload=()=>{img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(Error('Photo compression failed')),'image/jpeg',.82)};img.onerror=()=>reject(Error('Invalid image'));img.src=reader.result};reader.onerror=()=>reject(reader.error||Error('Could not read photo'));reader.readAsDataURL(file)})}
async function uploadFile(file,kind){const blob=await compress(file);const reader=new FileReader();const b=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');reader.onerror=()=>reject(reader.error||Error('Could not read photo'));reader.readAsDataURL(blob)});const r=await fetch('https://vyqyrcqrdsyrxywglqbh.supabase.co/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token,filename:file.name||'evidence.jpg',content_type:'image/jpeg',base64:b,kind})});const x=await r.json().catch(()=>({}));if(!r.ok||x.error)throw Error(x.error||'Upload failed');return x.path}
async function saveVisit(c,a,wrap){const msg=wrap.querySelector('.msg');setmsg(msg,'Saving…',true);const name=(wrap.querySelector('.customer-name')?.value||'').trim();const location=(wrap.querySelector('.location')?.value||'').trim();const pharm=(wrap.querySelector('.pharmacist')?.value||'').trim();const noStock=wrap.querySelector('.no-stock')?.checked===true;if(!name){setmsg(msg,'Customer name is required.');wrap.querySelector('.customer-name')?.focus();return}if(!location){setmsg(msg,'Location is required.');wrap.querySelector('.location')?.focus();return}if(!pharm){setmsg(msg,'Pharmacist name is required.');wrap.querySelector('.pharmacist')?.focus();return}const qtyEls=[...wrap.querySelectorAll('.qty-input')];const values=qtyEls.map(x=>x.value.trim()===''?0:Number(x.value));if(values.some(x=>!Number.isInteger(x)||x<0)){setmsg(msg,'Quantities must be whole numbers 0 or greater.');return}if(!noStock&&!values.some(x=>x>0)){setmsg(msg,'Enter a quantity greater than 0 for at least one item, or select No Stock.');return}if(noStock&&values.some(x=>x>0)){setmsg(msg,'No Stock cannot be selected when an item has a quantity.');return}const items=qtyEls.map(x=>({item_id:x.dataset.item,quantity:Number(x.value||0)}));const photo=wrap.querySelector('.photo').files[0];let attachment_path=null,signature_path=null;try{if(photo)attachment_path=await uploadFile(photo,'photo');else if(!wrap.dataset.attachmentPath){setmsg(msg,'A pharmacy/place photo is required before saving.');return}const sig=canvasData(wrap.querySelector('.signature'));if(sig)signature_path=await uploadBase64(sig,'signature.png','image/png','signature');const payload={id:wrap.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location,telephone:wrap.querySelector('.telephone').value.trim(),pharmacist_name:pharm,notes:wrap.querySelector('.notes').value.trim(),attachment_path,signature_path,status:noStock?'NO_STOCK':'SUBMITTED',items};const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:payload});wrap.dataset.visitId=r.visit_id;wrap.dataset.attachmentPath=attachment_path||wrap.dataset.attachmentPath||'';wrap.querySelector('.delete').classList.remove('hide');setmsg(msg,noStock?'Saved — No Stock. Server date/time recorded.':'Saved successfully. Server date/time recorded.',true);toast('Visit saved successfully');await load()}catch(e){setmsg(msg,e.message||'Could not save')}}
function buildList(){const list=$('#list');list.innerHTML='';const visits=(data?.campaigns||[]).flatMap(c=>(c.visits||[]).map(v=>({...v,campaign:c.campaign}))).sort((a,b)=>new Date(b.visited_at||b.updated_at||0)-new Date(a.visited_at||a.updated_at||0));if(!visits.length){list.innerHTML='<div class="small muted">No submitted visits yet.</div>';return}visits.forEach(v=>{const d=document.createElement('div');d.className='submission';d.innerHTML='<strong>'+esc(v.customer_name||'Untitled visit')+'</strong><div class="small muted">'+esc(v.campaign?.title||'Price change')+' · '+esc(v.visited_at?new Date(v.visited_at).toLocaleString():'Saved')+'</div><button class="btn menu-item" type="button">Edit</button>';d.querySelector('button').onclick=()=>{closeMenu();document.querySelector(`[data-visit-id="${CSS.escape(v.id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'})};list.appendChild(d)})}
$('#loginBtn').onclick=async()=>{const u=$('#u').value.trim().toUpperCase(),p=$('#p').value;setmsg($('#loginMsg'),'Signing in…',true);try{const r=await api('/rest/v1/rpc/dispatchops_driver_login',{p_username:u,p_password:p});token=r.token;sessionStorage.setItem(TOKEN,token);if($('#remember').checked)localStorage.setItem(CREDS,JSON.stringify({u,p}));else localStorage.removeItem(CREDS);await load()}catch(e){setmsg($('#loginMsg'),e.message)}};$('#menuBtn').onclick=openMenu;$('#close').onclick=closeMenu;$('#backdrop').onclick=closeMenu;$('#refresh').onclick=async()=>{try{await load();toast('Assignments refreshed');closeMenu()}catch(e){toast(e.message)}};$('#mine').onclick=()=>{buildList();openMenu()};$('#new').onclick=()=>{closeMenu();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};$('#logout').onclick=async()=>{try{if(token)await api('/rest/v1/rpc/dispatchops_driver_logout',{p_token:token})}catch{}sessionStorage.removeItem(TOKEN);token='';location.reload()};(()=>{try{const x=JSON.parse(localStorage.getItem(CREDS)||'null');if(x?.u&&x?.p){$('#u').value=x.u;$('#p').value=x.p;$('#remember').checked=true}}catch{}if(token)load().catch(()=>{sessionStorage.removeItem(TOKEN);token=''})})();
</script></body></html>
