<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DispatchOPS • Price Change Driver Portal</title><style>:root{--bg:#07111f;--card:#10213a99;--line:#9fb8d52b;--text:#f4f7fb;--muted:#9eacc3;--cyan:#61d8ff;--blue:#4f8cff;--red:#ff7184}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:15px Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#163663 0,transparent 35%),radial-gradient(circle at 90% 10%,#10385b 0,transparent 32%),linear-gradient(160deg,#07111f,#0b1830);padding:24px}main{max-width:1180px;margin:auto}.glass{background:linear-gradient(145deg,#1e345eaa,#0a162acc);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 70px #0005;backdrop-filter:blur(22px)}h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#3275ff,#56c7ff);font-weight:900}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:1.6px;color:var(--muted)}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#030a14aa;color:var(--text);outline:none}input:focus,textarea:focus{border-color:#4f8cff}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#ffffff0d;color:var(--text);cursor:pointer}.primary{background:linear-gradient(135deg,#3d78ff,#49bfff);font-weight:800}.danger{color:#ffd3d8}.field{display:grid;gap:6px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px}.customer{margin-top:12px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#06101f57}.item{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 110px;gap:12px}.item:last-child{border-bottom:0}.price{font-size:12px;color:var(--muted);margin-top:4px}.qty{min-width:0}.msg{margin-top:10px}.success{color:#57e6a1}.error{color:#ff7184}.hide{display:none!important}.login{max-width:520px;margin:10vh auto}.spinner{display:inline-block;width:15px;height:15px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){body{padding:12px}.top{align-items:flex-start}.item{grid-template-columns:1fr 88px}}</style></head><body><main><section id="login" class="glass login"><div class="brand"><div class="logo">DO</div><div><div class="eyebrow">DispatchOPS</div><h1 style="margin:2px 0 0">Driver Portal</h1></div></div><p class="muted">Sign in with your driver code. Only customers assigned to your driver account are shown.</p><div class="grid"><div class="field"><label>Driver username</label><input id="u" placeholder="e.g. DRV001" autocomplete="username"></div><div class="field"><label>Password</label><input id="p" type="password" value="driver" autocomplete="current-password"></div><button id="loginBtn" class="btn primary">Sign in</button><div id="loginMsg" class="msg muted"></div></div></section><section id="app" class="hide"><div class="glass top"><div class="brand"><div class="logo">DO</div><div><div class="eyebrow">Price Change</div><h2 id="driverName">Driver</h2><div id="driverMeta" class="muted"></div></div></div><button id="logout" class="btn">Sign out</button></div><div id="campaigns" class="grid"></div></section></main><script>const URL='https://chrokbnrlvrfejckmzuz.supabase.co',KEY='sb_publishable_kZAj4WW0l3skIibmjyR3zQ_83aCAjmY',TK='dispatchops.driver.session';let token=localStorage.getItem(TK)||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,body){const r=await fetch(URL+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.message||x.error||'Request failed');return x}function msg(el,t,ok=false){el.textContent=t;el.className='msg '+(ok?'success':'error')}async function load(){const x=await api('/rest/v1/rpc/dispatchops_driver_data',{p_token:token});if(!x?.driver)throw Error('Session expired');login.classList.add('hide');app.classList.remove('hide');driverName.textContent=x.driver.name||x.driver.code;driverMeta.textContent=[x.driver.code,x.driver.division].filter(Boolean).join(' • ');render(x.campaigns||[])}function render(cs){campaigns.innerHTML='';if(!cs.length){campaigns.innerHTML='<div class="glass"><h3>No open price-change lists</h3><p class="muted">Nothing is currently assigned to this driver.</p></div>';return}for(const c of cs){const card=document.createElement('section');card.className='glass';card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><p class="muted">Effective: '+esc(c.campaign.effective_date||'—')+' • '+esc(c.campaign.decree_numbers||'')+'</p>';for(const a of c.assignments||[]){const box=document.createElement('div');box.className='customer';box.innerHTML='<div class="row"><div class="field"><label>Pharmacy / Customer name *</label><input class="name" placeholder="Enter customer name"></div><div class="field"><label>Location *</label><input class="loc" '+(a.location_locked?'readonly':'')+' value="'+esc(a.location||'')+'" placeholder="Enter location"></div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="tel" value="'+esc(a.telephone||'')+'" placeholder="Optional"></div></div><div class="items"></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacist name *</label><input class="pharm" placeholder="Required"></div><div class="field"><label>Notes <span class="muted">optional</span></label><input class="notes" placeholder="Optional"></div></div><div class="row" style="margin-top:14px"><button class="btn primary save">Save / Submit</button><span class="msg"></span></div>';const ih=box.querySelector('.items');const assigned=new Set((c.assignment_items||[]).filter(z=>z.assignment_id===a.id).map(z=>z.item_id));for(const i of c.items||[]){if(!assigned.has(i.id))continue;const d=document.createElement('div');d.className='item';d.innerHTML='<div><strong>'+esc(i.line_no)+'. '+esc(i.item_description)+'</strong><div class="price">Old Pharmacy: '+esc(i.old_pharmacy_price)+' • Old Public: '+esc(i.old_public_price)+'<br>New Pharmacy: '+esc(i.new_pharmacy_price)+' • New Public: '+esc(i.new_public_price)+'</div></div><input class="qty" data-item="'+i.id+'" type="number" min="0" step="1" placeholder="Qty" required>';ih.appendChild(d)}const existing=(c.visits||[]).find(v=>v.assignment_id===a.id||v.customer_name===a.customer_name);if(existing){box.dataset.visit=existing.id;box.querySelector('.name').value=existing.customer_name||'';box.querySelector('.loc').value=existing.location||box.querySelector('.loc').value;box.querySelector('.tel').value=existing.telephone||'';box.querySelector('.pharm').value=existing.pharmacist_name||'';box.querySelector('.notes').value=existing.notes||'';for(const vi of existing.price_change_visit_items||[]) {const q=box.querySelector('[data-item="'+vi.item_id+'"]');if(q)q.value=vi.quantity??0}}box.querySelector('.save').onclick=()=>save(c.campaign.id,a,box,box.querySelector('.msg'));card.appendChild(box)}campaigns.appendChild(card)}}async function save(cid,a,box,m){try{msg(m,'Saving…',true);const name=box.querySelector('.name').value.trim(),loc=box.querySelector('.loc').value.trim(),ph=box.querySelector('.pharm').value.trim();if(!name||!loc||!ph)throw Error('Customer name, location and pharmacist name are required.');const qs=[...box.querySelectorAll('.qty')];if(qs.some(q=>q.value===''))throw Error('Quantity is required for every assigned item.');const items=qs.map(q=>({item_id:q.dataset.item,quantity:Number(q.value)}));const x=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:{id:box.dataset.visit||null,assignment_id:a.id,campaign_id:cid,customer_name:name,location:loc,telephone:box.querySelector('.tel').value.trim(),pharmacist_name:ph,notes:box.querySelector('.notes').value.trim(),items}});box.dataset.visit=x.visit_id;msg(m,'Saved successfully. Server date/time recorded automatically.',true)}catch(e){msg(m,e.message||'Could not save')}}loginBtn.onclick=async()=>{try{loginMsg.textContent='Signing in…';const x=await api('/rest/v1/rpc/dispatchops_driver_login',{p_username:u.value.trim(),p_password:p.value});token=x.token;localStorage.setItem(TK,token);await load()}catch(e){loginMsg.textContent=e.message||'Invalid username or password'}}logout.onclick=async()=>{try{if(token)await api('/rest/v1/rpc/dispatchops_driver_logout',{p_token:token})}catch{}localStorage.removeItem(TK);token='';location.reload()};if(token)load().catch(()=>{localStorage.removeItem(TK);token=''});</script></body></html>
