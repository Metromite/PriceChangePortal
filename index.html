<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>City Pharmacy • Price Change Portal</title><style>
:root{--bg:#07111f;--bg2:#0b1830;--glass:rgba(18,31,54,.68);--line:rgba(160,190,235,.16);--text:#f4f7fb;--muted:#9eacc3;--blue:#4f8cff;--cyan:#61d8ff;--green:#57e6a1;--red:#ff7184;--shadow:0 24px 70px rgba(0,0,0,.32)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0%,#163663 0,transparent 35%),radial-gradient(circle at 90% 10%,#10385b 0,transparent 32%),linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.035),transparent 35%,rgba(255,255,255,.02));backdrop-filter:blur(10px)}main{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:18px 0 48px;position:relative}.glass{background:linear-gradient(145deg,rgba(30,52,86,.68),rgba(10,22,40,.62));border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:56px;height:56px;border-radius:14px;object-fit:contain;background:#eee;display:block;box-shadow:0 10px 30px rgba(50,117,255,.25)}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.customer{padding:18px;border-radius:18px;background:rgba(6,16,31,.34);border:1px solid rgba(160,190,235,.12);margin-top:12px}.customer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(79,140,255,.13);border:1px solid rgba(79,140,255,.25);font-size:12px;color:#cfe0ff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}label{font-size:13px;color:#c8d4e7}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(3,10,20,.46);color:var(--text);outline:none}input:focus,textarea:focus{border-color:rgba(79,140,255,.65);box-shadow:0 0 3px rgba(79,140,255,.1)}input[readonly],.locked-location{opacity:.85}.locked-location{padding:12px 13px;border-radius:12px;border:1px solid rgba(87,230,161,.24);background:rgba(87,230,161,.06);min-height:46px}.btn{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.055);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:linear-gradient(135deg,#3d78ff,#49bfff);border-color:rgba(150,220,255,.35);font-weight:800}.btn.danger{color:#ffd3d8;border-color:rgba(255,113,132,.25)}.btn:disabled{opacity:.45;cursor:not-allowed}.item{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:14px;padding:14px 0;border-bottom:1px solid rgba(160,190,235,.1)}.item:last-child{border-bottom:0}.prices{font-size:13px;color:var(--muted);margin-top:5px}.qty-input{font-size:21px!important;font-weight:900;text-align:center;padding:15px!important;min-height:54px}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:12px}.signature-wrap{height:150px;border:1px dashed rgba(160,190,235,.25);border-radius:14px;background:rgba(0,0,0,.18);overflow:hidden}.signature-wrap canvas{width:100%;height:100%;touch-action:none;display:block}.small{font-size:12px}.success{color:var(--green)}.error{color:var(--red)}.hide{display:none!important}.login{max-width:560px;margin:7vh auto 0}.login .glass{padding:28px}.login-logo{width:92px;height:92px;border-radius:20px;object-fit:contain;background:#eee;box-shadow:0 16px 40px rgba(50,117,255,.25)}.menu-btn{width:48px;height:48px;padding:0;font-size:25px;border-radius:14px}.drawer{position:fixed;z-index:50;top:0;right:0;width:min(360px,88vw);height:100vh;padding:18px;background:rgba(8,18,34,.96);border-left:1px solid var(--line);box-shadow:-25px 0 60px rgba(0,0,0,.35);backdrop-filter:blur(22px);transform:translateX(105%);transition:transform .2s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-backdrop{position:fixed;z-index:45;inset:0;background:rgba(0,0,0,.38);backdrop-filter:blur(2px)}.menu-item{width:100%;justify-content:flex-start;padding:14px 15px;margin-top:8px;font-weight:700}.submission{padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:rgba(255,255,255,.035)}.no-stock-box{padding:18px 18px;border:1px solid rgba(97,216,255,.22);border-radius:14px;background:rgba(79,140,255,.07)}.no-stock-label{font-size:19px!important;font-weight:900!important;display:flex;align-items:center;gap:11px;min-height:30px}.no-stock-label input{width:26px!important;height:26px!important;accent-color:#4f8cff;flex:0 0 auto}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toast{position:fixed;z-index:80;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,90vw);padding:12px 16px;border-radius:14px;background:rgba(9,22,42,.95);border:1px solid var(--line);box-shadow:var(--shadow)}@media(max-width:760px){main{width:min(100% - 14px,1180px);padding-top:8px}.glass{border-radius:18px;padding:16px}.item{grid-template-columns:1fr 100px}.evidence{grid-template-columns:1fr}.top{align-items:flex-start}.top .btn{padding:9px 11px}.brand-logo{width:50px;height:50px}}
</style></head><body><main>
<section id="login" class="login"><div class="glass"><div style="display:flex;justify-content:center;margin-bottom:16px"><img class="login-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA7AAAARhCAIAAACUGv6RAAAKOml..." alt="City Pharmacy"></div><div style="text-align:center"><div class="eyebrow">City Pharmacy</div><h1 style="margin:4px 0;font-size:30px">Price Change Portal</h1><p class="muted" style="margin:8px 0 22px">Sign in with your driver code to complete your assigned price changes.</p></div><div class="grid"><div class="field"><label>Driver username</label><input id="u" autocomplete="username" autocapitalize="characters" placeholder="e.g. DRV001"></div><div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password" placeholder="Password"></div><label style="display:flex;align-items:center;gap:9px;font-size:13px"><input id="remember" type="checkbox" style="width:18px;height:18px"> Save username &amp; password on this device</label><div class="small muted">Initial password: <b>driver</b></div><button id="loginBtn" class="btn primary" style="padding:13px">Sign in</button><div id="loginMsg" class="small"></div></div></div></section>
<section id="app" class="hide"><div class="glass top"><div class="brand"><img class="brand-logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA7AAAARhCAIAAACUGv6RAAAKOml..." alt="City Pharmacy"><div><div class="eyebrow">Driver Price Change Portal</div><h2 id="driverName" style="margin:2px 0 0"></h2><div id="driverMeta" class="muted small"></div></div></div><div style="display:flex;gap:8px"><button id="menuBtn" class="btn menu-btn" aria-label="Open menu">☰</button><button id="logout" class="btn">Sign out</button></div></div><div id="campaigns" class="grid"></div></section></main>
<div id="drawerBackdrop" class="drawer-backdrop hide"></div><aside id="drawer" class="drawer"><div class="section-title"><h2 style="margin:0">Menu</h2><button id="closeMenu" class="btn">Close</button></div><button id="newSubmission" class="btn primary menu-item">＋ New submission</button><button id="mySubmissions" class="btn menu-item">✓ My submitted visits</button><button id="refreshData" class="btn menu-item">↻ Refresh assignments</button><div id="submissionList" style="margin-top:18px"></div></aside><div id="toast" class="toast hide"></div>
<script>
const SUPABASE_URL='https://vyqyrcqrdsyrxywglqbh.supabase.co';const SUPABASE_KEY='sb_publishable_CreQOVJ9ZYkp6PGBqWHlVA_q1CSur1n';const TOKEN_KEY='dispatchops.driver.session';const CREDS_KEY='dispatchops.driver.credentials';const api=(path,body)=>fetch(SUPABASE_URL+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(async r=>{const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.message||x.error||'Request failed');return x});let token=sessionStorage.getItem(TOKEN_KEY)||'',lastData=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const setMsg=(el,text,ok=false)=>{el.textContent=text;el.className='small '+(ok?'success':'error')};const toast=text=>{const t=document.querySelector('#toast');t.textContent=text;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2200)};function openMenu(){document.querySelector('#drawer').classList.add('open');document.querySelector('#drawerBackdrop').classList.remove('hide');buildSubmissionList()}function closeMenu(){document.querySelector('#drawer').classList.remove('open');document.querySelector('#drawerBackdrop').classList.add('hide')}
async function load(){const x=await api('/rest/v1/rpc/dispatchops_driver_data',{p_token:token});if(!x?.driver)throw new Error('Session expired');lastData=x;document.querySelector('#login').classList.add('hide');document.querySelector('#app').classList.remove('hide');document.querySelector('#driverName').textContent=x.driver.name||x.driver.code;document.querySelector('#driverMeta').textContent=(x.driver.code||'')+' · '+(x.driver.division||'');render(x.campaigns||[]);buildSubmissionList()}
function render(campaigns){const root=document.querySelector('#campaigns');root.innerHTML='';if(!campaigns.length){root.innerHTML='<div class="glass"><h3>No open price-change list</h3><p class="muted">Nothing has been assigned to your driver account yet.</p></div>';return}for(const c of campaigns){const card=document.createElement('section');card.className='glass';card.dataset.campaign=c.campaign.id;card.innerHTML='<div class="eyebrow">Price change list</div><h2>'+esc(c.campaign.title)+'</h2><div class="muted small">Complete the assigned customer visits below. Server date/time is recorded automatically.</div><div class="customers"></div>';const host=card.querySelector('.customers');for(const a of c.assignments||[])renderCustomer(host,c,a);root.appendChild(card)}}
function renderCustomer(host,c,a){const wrap=document.createElement('div');wrap.className='customer';wrap.dataset.assignmentId=a.id;const existing=(c.visits||[]).find(v=>v.assignment_id===a.id);if(existing)wrap.dataset.visitId=existing.id||'';wrap.dataset.attachmentPath=existing?.attachment_path||'';const locked=!!a.location_locked;const lock=locked?'🔒 Location locked by admin':'Location can be entered by driver';wrap.innerHTML='<div class="customer-head"><div><div class="eyebrow">Assigned customer</div><h3 class="ctitle" style="margin:4px 0">'+(esc(a.customer_name)||'Customer name required')+'</h3><span class="pill">'+esc(lock)+'</span></div><div class="small muted">'+(a.telephone?esc(a.telephone):'Telephone optional')+'</div></div><div class="row" style="margin-top:14px"><div class="field"><label>Pharmacy / Customer name <b style="color:var(--red)">*</b></label><input class="customer-name" value="'+esc(existing?.customer_name||a.customer_name)+'" placeholder="Enter pharmacy name"></div><div class="field"><label>Location <b style="color:var(--red)">*</b></label>'+(locked?'<div class="location locked-location">🔒 '+(esc(a.location)||'Location locked by admin')+'</div><input class="location" type="hidden" value="'+esc(a.location)+'">':'<input class="location" value="'+esc(existing?.location||a.location)+'" placeholder="Enter location">')+'</div><div class="field"><label>Telephone / Mobile <span class="muted">optional</span></label><input class="telephone" value="'+esc(existing?.telephone||a.telephone||'')+'" placeholder="Optional"></div></div><div class="items"></div><div class="evidence" style="margin-top:14px"><div class="field"><label>Pharmacist name <b style="color:var(--red)">*</b></label><input class="pharmacist" placeholder="Required before submit"></div><div class="field"><label>Pharmacy / place photo <b style="color:var(--red)">*</b></label><input class="photo" type="file" accept="image/*"><div class="small muted">Required for the first save. Existing saved photo can be reused when editing.</div></div></div><div class="no-stock-box" style="margin-top:12px"><label class="no-stock-label"><input class="no-stock" type="checkbox"> No Stock — nothing repriced at this customer</label><div class="small muted" style="margin-top:5px">Use this only when no item was repriced.</div></div><div style="margin-top:12px"><label>Signature / Stamp <span class="muted">optional</span></label><div class="signature-wrap"><canvas class="signature"></canvas></div><div class="row" style="margin-top:7px"><button class="btn clear-sign" type="button">Clear signature</button><span class="small muted sig-status"></span></div></div><div class="field" style="margin-top:12px"><label>Notes <span class="muted">optional</span></label><textarea class="notes" rows="2"></textarea></div><div class="row" style="margin-top:14px"><button class="btn primary save" type="button">Save / Submit visit</button><button class="btn danger delete hide" type="button">Delete my submission</button><span class="msg small"></span></div>';const ih=wrap.querySelector('.items');const assigned=new Set((c.assignment_items||[]).filter(x=>x.assignment_id===a.id).map(x=>x.item_id));for(const item of c.items||[]){if(!assigned.has(item.id))continue;const r=document.createElement('div');r.className='item';const old=(existing?.price_change_visit_items||[]).find(vi=>vi.item_id===item.id);r.innerHTML='<div><strong>'+esc(item.line_no)+'. '+esc(item.item_description)+'</strong><div class="prices">New Price: '+esc(item.new_public_price??item.new_pharmacy_price??'—')+'</div></div><div class="field qty"><label>Quantity</label><input class="qty-input" data-item="'+item.id+'" type="number" min="0" step="1" value="'+(old?.quantity??'')+'"></div>';ih.appendChild(r)}if(existing){wrap.querySelector('.pharmacist').value=existing.pharmacist_name||'';wrap.querySelector('.notes').value=existing.notes||'';if(existing.status==='NO_STOCK')wrap.querySelector('.no-stock').checked=true;wrap.querySelector('.delete').classList.remove('hide')}setupSignature(wrap.querySelector('.signature'),wrap.querySelector('.clear-sign'),wrap.querySelector('.sig-status'));wrap.querySelector('.save').onclick=()=>saveVisit(c,a,wrap);wrap.querySelector('.delete').onclick=async()=>{if(!wrap.dataset.visitId||!confirm('Delete your submission?'))return;try{await api('/rest/v1/rpc/dispatchops_driver_delete_visit',{p_token:token,p_visit_id:wrap.dataset.visitId});toast('Submission deleted');await load()}catch(e){setMsg(wrap.querySelector('.msg'),e.message)}};host.appendChild(wrap)}
function setupSignature(canvas,clear,status){const bind=(cv,btn)=>{const ctx=cv.getContext('2d');let drawing=false;const dpr=Math.max(1,window.devicePixelRatio||1);const size=()=>{const r=cv.getBoundingClientRect();const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#e9f2ff'};size();const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);size();const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)});cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>drawing=false));btn.onclick=()=>{const fresh=cv.cloneNode(false);fresh.width=1;fresh.height=1;cv.replaceWith(fresh);bind(fresh,btn);if(status)status.textContent='Signature cleared'}};bind(canvas,clear)}
function canvasData(canvas){const ctx=canvas.getContext('2d');const a=ctx.getImageData(0,0,canvas.width,canvas.height).data;for(let i=3;i<a.length;i+=4)if(a[i]>0)return canvas.toDataURL('image/png');return null}
async function saveVisit(c,a,wrap){const msg=wrap.querySelector('.msg');setMsg(msg,'Saving…',true);const name=(wrap.querySelector('.customer-name')?.value||'').trim();const location=(wrap.querySelector('.location')?.value||'').trim();const pharm=(wrap.querySelector('.pharmacist')?.value||'').trim();const noStock=wrap.querySelector('.no-stock')?.checked===true;if(!name){setMsg(msg,'Customer name is required.');wrap.querySelector('.customer-name')?.focus();return}if(!location){setMsg(msg,'Location is required.');wrap.querySelector('.location')?.focus();return}if(!pharm){setMsg(msg,'Pharmacist name is required.');wrap.querySelector('.pharmacist')?.focus();return}const qtyEls=[...wrap.querySelectorAll('.qty-input')];const values=qtyEls.map(x=>x.value.trim()===''?0:Number(x.value));if(values.some(x=>!Number.isInteger(x)||x<0)){setMsg(msg,'Quantities must be whole numbers 0 or greater.');return}if(!noStock&&!values.some(x=>x>0)){setMsg(msg,'Enter a quantity greater than 0 for at least one item, or select No Stock.');return}if(noStock&&values.some(x=>x>0)){setMsg(msg,'No Stock cannot be selected when an item has a quantity.');return}const items=qtyEls.map(x=>({item_id:x.dataset.item,quantity:Number(x.value||0)}));const photo=wrap.querySelector('.photo').files[0];let attachment_path=null,signature_path=null;try{if(photo)attachment_path=await uploadFile(photo,'photo');else if(!wrap.dataset.attachmentPath){setMsg(msg,'A pharmacy/place photo is required before saving.');return}const sig=canvasData(wrap.querySelector('.signature'));if(sig)signature_path=await uploadBase64(sig,'signature.png','image/png','signature');const payload={id:wrap.dataset.visitId||null,assignment_id:a.id,campaign_id:c.campaign.id,customer_name:name,location,telephone:wrap.querySelector('.telephone').value.trim(),pharmacist_name:pharm,notes:wrap.querySelector('.notes').value.trim(),attachment_path,signature_path,status:noStock?'NO_STOCK':'SUBMITTED',items};const r=await api('/rest/v1/rpc/dispatchops_driver_save_visit',{p_token:token,p_visit:payload});wrap.dataset.visitId=r.visit_id;wrap.dataset.attachmentPath=attachment_path||wrap.dataset.attachmentPath||'';wrap.querySelector('.delete').classList.remove('hide');setMsg(msg,noStock?'Saved — No Stock. Server date/time recorded.':'Saved successfully. Server date/time recorded.',true);toast('Visit saved successfully');await load()}catch(e){setMsg(msg,e.message||'Could not save')}}
async function uploadFile(file,kind){const data=await compress(file);return uploadBase64(data,file.name,file.type,kind)}async function uploadBase64(data,name,type,kind){const raw=String(data||'').replace(/^data:[^,]*,/,'').replace(/\s/g,'');if(!raw)throw new Error('Evidence data is empty');const r=await fetch(SUPABASE_URL+'/functions/v1/dispatchops-price-change-upload',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({token,filename:name,content_type:type,base64:raw,kind})});const x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||x.message||'Evidence upload failed');return x.path}function compress(file){return new Promise((res,rej)=>{const im=new Image(),rd=new FileReader();rd.onload=()=>{im.onload=()=>{const max=1600,s=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,im.width*s);cv.height=Math.max(1,im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.76).split(',')[1])};im.src=rd.result};rd.onerror=rej;rd.readAsDataURL(file)})}
function buildSubmissionList(){const root=document.querySelector('#submissionList');if(!root||!lastData)return;const visits=(lastData.campaigns||[]).flatMap(c=>(c.visits||[]).map(v=>({...v,campaign:c})));root.innerHTML='<div class="eyebrow">Your submitted visits</div>';if(!visits.length){root.innerHTML+='<p class="muted small">No submissions yet.</p>';return}for(const v of visits){const el=document.createElement('div');el.className='submission';el.innerHTML='<strong>'+esc(v.customer_name||'Unnamed customer')+'</strong><div class="small muted">'+esc(v.location||'')+' · '+esc(v.status||'SUBMITTED')+'</div><div class="small muted">'+(v.visited_at?new Date(v.visited_at).toLocaleString():'')+'</div><button class="btn menu-item" data-visit="'+esc(v.id)+'">Edit this visit</button>';el.querySelector('button').onclick=()=>{closeMenu();const target=document.querySelector('[data-visit-id="'+CSS.escape(v.id)+'"]');if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.style.outline='2px solid var(--cyan)';setTimeout(()=>target.style.outline='',1400)}};root.appendChild(el)}}
document.querySelector('#menuBtn').onclick=openMenu;document.querySelector('#closeMenu').onclick=closeMenu;document.querySelector('#drawerBackdrop').onclick=closeMenu;document.querySelector('#mySubmissions').onclick=()=>{buildSubmissionList();toast('Your submitted visits are shown in the menu')};document.querySelector('#refreshData').onclick=async()=>{try{await load();toast('Assignments refreshed')}catch(e){toast(e.message)}};document.querySelector('#newSubmission').onclick=()=>{closeMenu();const target=[...document.querySelectorAll('.customer')].find(x=>!x.dataset.visitId)||document.querySelector('.customer');if(target){target.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>target.querySelector('.customer-name')?.focus(),250)}};(function restoreCreds(){try{const c=JSON.parse(localStorage.getItem(CREDS_KEY)||'null');if(c?.username){document.querySelector('#u').value=c.username;document.querySelector('#remember').checked=true;if(c.password)document.querySelector('#p').value=c.password}}catch{}})();document.querySelector('#loginBtn').onclick=async()=>{const m=document.querySelector('#loginMsg');m.textContent='Signing in…';try{const username=document.querySelector('#u').value.trim(),password=document.querySelector('#p').value;if(!username||!password)throw new Error('Enter username and password');const x=await api('/rest/v1/rpc/dispatchops_driver_login',{p_username:username,p_password:password});token=x.token;sessionStorage.setItem(TOKEN_KEY,token);if(document.querySelector('#remember').checked)localStorage.setItem(CREDS_KEY,JSON.stringify({username,password}));else localStorage.removeItem(CREDS_KEY);await load()}catch(e){setMsg(m,e.message||'Invalid username or password')}};document.querySelector('#logout').onclick=async()=>{try{if(token)await api('/rest/v1/rpc/dispatchops_driver_logout',{p_token:token})}catch{}sessionStorage.removeItem(TOKEN_KEY);token='';location.reload()};if(token)load().catch(()=>{sessionStorage.removeItem(TOKEN_KEY);token=''})
</script></body></html>
